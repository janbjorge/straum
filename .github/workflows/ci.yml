name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: python3 scripts/check-layers.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 19rc1 until PostgreSQL 19 ships.
        postgres: ["17", "18", "19rc1"]
    env:
      STRAUM_TEST_POSTGRES: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --all-targets --fail-under-lines 98

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      # The plugin's signature is checked against its key at the same tag.
      - name: Install helm-unittest
        run: |
          base=https://github.com/helm-unittest/helm-unittest
          curl -fsSLO "$base/releases/download/v1.2.1/unittest-1.2.1.tgz"
          curl -fsSLO "$base/releases/download/v1.2.1/unittest-1.2.1.tgz.prov"
          curl -fsSL -o key.asc "$base/raw/v1.2.1/public-key.asc"
          sha256sum -c <<'SUMS'
          bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f  unittest-1.2.1.tgz
          ac389b1ec426189a973d080ebe870f53d35217ba665bd7dd216bb05f4c50ddcf  key.asc
          SUMS
          gpg --dearmor < key.asc > keyring.gpg
          helm plugin install unittest-1.2.1.tgz --keyring keyring.gpg
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/check-chart.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t straum:ci .
      - run: docker run --rm straum:ci help

  # latest must name the newest commit on main that passed CI. Concurrency
  # cancels a run once a newer push starts, and this check keeps a re-run
  # of an older commit from moving latest back.
  head:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        run: |
          main=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          echo "current=$([ "$main" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Publishes ghcr.io/janbjorge/straum:latest for amd64 and arm64, each built
  # on its own native runner, since under emulation the Rust build crawls.
  # The OCI labels and index annotations come from the repository's
  # description and license; provenance and SBOM attestations are signed
  # through GitHub OIDC.
  publish:
    needs: [head, test, image]
    if: needs.head.outputs.current == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      sbom: true
      meta-images: ghcr.io/janbjorge/straum
      meta-tags: type=raw,value=latest
      set-meta-labels: true
      set-meta-annotations: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mdBook's release binary, checked against its sum when it was pinned.
      - name: Install mdBook
        run: |
          tarball=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$tarball"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $tarball" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  # Publishes the guide to GitHub Pages; the repository's Pages source must
  # be GitHub Actions.
  pages:
    if: github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
