name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A release is published on the release page, which makes its tag
  # (ADR-0012). Drafts start nothing.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # As rust-toolchain.toml and the Dockerfile pin it.
  RUST: 1.100.0

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
          components: rustfmt
      # just runs every check, as it does locally; this one needs no uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - run: just fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
          components: clippy
      # Dependencies only: rust-cache drops the workspace crates before it
      # saves, and keys on Cargo.lock and rustc. Only main saves, so a pull
      # request can't write what main reads. The image job builds cold.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just runs every check, as it does locally; its crate recipes and
      # scripts need uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,uv
      - run: just lint all

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
      # just runs every check, as it does locally; its crate recipes and
      # scripts need uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,uv
      - run: just scripts

  # A published advisory against a locked dependency fails the run, and
  # with it a release.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
      # The release binary, checked against the sum in the action's manifest,
      # instead of a build from source.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-audit@0.23.0
      - run: just audit

  # The workspace tests on each major. 18, the tests' default, runs them
  # under coverage instead, so no major runs them twice.
  test:
    name: test (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    # A run takes about 5 minutes. A test waiting on a commit that never
    # comes fails here instead of holding the runner for 6 hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18", "19"]
        include:
          - postgres: "18"
            coverage: true
    env:
      STRAUM_TEST_POSTGRES: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
          components: ${{ matrix.coverage && 'llvm-tools-preview' || '' }}
      # Coverage builds with other flags, so it keeps a cache of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.coverage && 'coverage' || 'plain' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just runs every check, as it does locally; its crate recipes and
      # scripts need uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,uv
      - if: ${{ !matrix.coverage }}
        run: just test all
      # The release binary, checked against the sum in the action's manifest,
      # instead of a build from source.
      - if: ${{ matrix.coverage }}
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: ${{ matrix.coverage }}
        run: just cov all

  # The physical stream against PostgreSQL on every supported major: random
  # workloads, compared byte for byte with a logical slot and, under
  # wal_level=replica, with SQL. Each run tries new seeds; a re-run the
  # same ones, and a failure names its seed.
  correctness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18", "19"]
    env:
      STRAUM_TEST_POSTGRES: ${{ matrix.postgres }}
      STRAUM_TEST_SEEDS: "50"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # just runs every check, as it does locally; its crate recipes and
      # scripts need uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,uv
      - run: echo "STRAUM_TEST_SEED_FROM=$((GITHUB_RUN_NUMBER * 1000))" >> "$GITHUB_ENV"
      - run: just correctness

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1
      # The plugin's signature is checked against its key at the same tag.
      - name: Install helm-unittest
        run: |
          base=https://github.com/helm-unittest/helm-unittest
          curl -fsSLO "$base/releases/download/v1.2.1/unittest-1.2.1.tgz"
          curl -fsSLO "$base/releases/download/v1.2.1/unittest-1.2.1.tgz.prov"
          curl -fsSL -o key.asc "$base/raw/v1.2.1/public-key.asc"
          sha256sum -c <<'SUMS'
          bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f  unittest-1.2.1.tgz
          ac389b1ec426189a973d080ebe870f53d35217ba665bd7dd216bb05f4c50ddcf  key.asc
          SUMS
          gpg --dearmor < key.asc > keyring.gpg
          helm plugin install unittest-1.2.1.tgz --keyring keyring.gpg
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # just runs every check, as it does locally; its crate recipes and
      # scripts need uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,uv
      - run: just chart

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # just runs every check, as it does locally; this one needs no uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - run: just image

  # Only a release publishes. It fails unless its tag is vX.Y.Z on a
  # commit on main, marked pre-release exactly when it has a suffix, and
  # has no assets yet: publishing again would move the image tags off the
  # digest the release names. latest goes only to the highest release
  # without a suffix, so a fix to an older line doesn't move it back.
  gate:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      latest: ${{ steps.gate.outputs.latest }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: gate
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          if [ "$PRERELEASE" != "$([[ $TAG == *-* ]] && echo true || echo false)" ]; then
            echo "::error::$TAG must be marked pre-release exactly when it has a suffix"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json assets --jq '.assets | length')" != 0 ]; then
            echo "::error::$TAG already has assets; make a new release instead"
            exit 1
          fi
          highest=$(git tag -l 'v[0-9]*' --sort=-v:refname | awk '!/-/' | head -1)
          {
            echo "latest=$([ "$TAG" = "$highest" ] && echo true || echo false)"
            echo "version=${TAG#v}"
            echo "tag=$TAG"
            echo publish=true
          } >> "$GITHUB_OUTPUT"

  # Publishes ghcr.io/janbjorge/straum for amd64 and arm64, each built on
  # its own native runner, since under emulation the Rust build crawls,
  # as X.Y.Z, X.Y and, from the gate, latest. The OCI labels and
  # index annotations come from the repository's description and license;
  # provenance and SBOM attestations are signed through GitHub OIDC.
  publish:
    needs: [gate, format, lint, architecture, audit, test, correctness, chart, image, docs]
    if: needs.gate.outputs.publish == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      sbom: true
      build-args: STRAUM_VERSION=${{ needs.gate.outputs.version }}
      meta-images: ghcr.io/janbjorge/straum
      # type=semver reads the tag only on a tag push, so a release passes it.
      # flavor latest=false keeps metadata-action from adding latest itself.
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=latest,enable=${{ needs.gate.outputs.latest }}
        type=semver,pattern={{version}},value=${{ needs.gate.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.tag }}
      set-meta-labels: true
      set-meta-annotations: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Fills the release: the binaries copied out of the image just published,
  # so they are the bytes the image runs, their sums, the chart at the
  # release's version, and signed provenance attestations for all three.
  # The notes gain the image digest, the chart and how to verify.
  release:
    if: github.event_name == 'release'
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Copy the binaries out of the image
        run: |
          mkdir dist
          for pair in amd64:x86_64 arm64:aarch64; do
            printf '{"services": {"straum": {"image": "ghcr.io/janbjorge/straum@%s", "platform": "linux/%s"}}}' \
              "$DIGEST" "${pair%%:*}" |
              docker compose -p straum-release -f - create --pull always straum
            docker compose -p straum-release cp straum:/straum "dist/straum-${pair#*:}-unknown-linux-musl"
            docker compose -p straum-release down
          done
          case $(file -b dist/straum-x86_64-unknown-linux-musl) in
            *x86-64*static*) ;;
            *) echo "::error::the amd64 binary is not static x86-64"; exit 1 ;;
          esac
          case $(file -b dist/straum-aarch64-unknown-linux-musl) in
            *aarch64*static*) ;;
            *) echo "::error::the arm64 binary is not static aarch64"; exit 1 ;;
          esac
          test "$(dist/straum-x86_64-unknown-linux-musl version)" = "straum $VERSION"
          (cd dist && sha256sum straum-* > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/straum-*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/janbjorge/straum
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1
      # The repository's chart says 0.0.0; the published one says the
      # release's version for both, so a plain install pulls this image.
      - name: Publish the chart
        id: chart
        run: |
          helm package deploy/helm/straum --version "$VERSION" --app-version "$VERSION" --destination chart
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          pushed=$(helm push "chart/straum-$VERSION.tgz" oci://ghcr.io/janbjorge/charts 2>&1)
          echo "$pushed"
          digest=$(echo "$pushed" | awk '/^Digest:/ {print $2}')
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/janbjorge/charts/straum
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Attach the binaries and extend the notes
        run: |
          ls -la dist
          gh release upload "$TAG" \
            dist/straum-x86_64-unknown-linux-musl \
            dist/straum-aarch64-unknown-linux-musl \
            dist/SHA256SUMS
          gh release view "$TAG" --json body --jq .body > notes.md
          fence='```'
          cat >> notes.md <<NOTES

          ## Image

          In a \`compose.yaml\`, by tag or by digest:

          ${fence}yaml
          services:
            straum:
              image: ghcr.io/janbjorge/straum:$VERSION
              # image: ghcr.io/janbjorge/straum@$DIGEST
          ${fence}

          ${fence}sh
          docker compose pull straum
          ${fence}

          ## Chart

          ${fence}sh
          helm upgrade --install straum oci://ghcr.io/janbjorge/charts/straum --version $VERSION \\
            --set dsn.existingSecret=straum-dsn --set-file spec=spec.sql
          ${fence}

          ## Verify

          ${fence}sh
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify straum-x86_64-unknown-linux-musl --repo $GH_REPO
          gh attestation verify oci://ghcr.io/janbjorge/straum:$VERSION --repo $GH_REPO
          gh attestation verify oci://ghcr.io/janbjorge/charts/straum:$VERSION --repo $GH_REPO
          ${fence}
          NOTES
          gh release edit "$TAG" --notes-file notes.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # mdBook's release binary, checked against its sum when it was pinned.
      - name: Install mdBook
        run: |
          tarball=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$tarball"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $tarball" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      # just runs every check, as it does locally; this one needs no uv.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - run: just docs
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  # Publishes the guide to GitHub Pages; the repository's Pages source must
  # be GitHub Actions.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
