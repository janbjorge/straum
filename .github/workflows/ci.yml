name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A release is published on the release page, which makes its tag
  # (ADR-0036). Drafts start nothing.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # As rust-toolchain.toml and the Dockerfile pin it.
  RUST: 1.100.0

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
      - run: python3 scripts/check-layers.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 19rc1 until PostgreSQL 19 ships. 18, the tests' default, runs in
        # coverage.
        postgres: ["16", "17", "19rc1"]
    env:
      STRAUM_TEST_POSTGRES: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST }}
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --workspace --all-targets --fail-under-lines 98

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1
      # The plugin's signature is checked against its key at the same tag.
      - name: Install helm-unittest
        run: |
          base=https://github.com/helm-unittest/helm-unittest
          curl -fsSLO "$base/releases/download/v1.2.1/unittest-1.2.1.tgz"
          curl -fsSLO "$base/releases/download/v1.2.1/unittest-1.2.1.tgz.prov"
          curl -fsSL -o key.asc "$base/raw/v1.2.1/public-key.asc"
          sha256sum -c <<'SUMS'
          bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f  unittest-1.2.1.tgz
          ac389b1ec426189a973d080ebe870f53d35217ba665bd7dd216bb05f4c50ddcf  key.asc
          SUMS
          gpg --dearmor < key.asc > keyring.gpg
          helm plugin install unittest-1.2.1.tgz --keyring keyring.gpg
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/check-chart.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t straum:ci .
      - run: docker run --rm straum:ci help

  # Only a release publishes. It fails unless its tag is vX.Y.Z on a
  # commit on main, marked pre-release exactly when it has a suffix, and
  # has no assets yet: publishing again would move the image tags off the
  # digest the release names. latest goes only to the highest release
  # without a suffix, so a fix to an older line doesn't move it back.
  gate:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      latest: ${{ steps.gate.outputs.latest }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: gate
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          if [ "$PRERELEASE" != "$([[ $TAG == *-* ]] && echo true || echo false)" ]; then
            echo "::error::$TAG must be marked pre-release exactly when it has a suffix"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json assets --jq '.assets | length')" != 0 ]; then
            echo "::error::$TAG already has assets; make a new release instead"
            exit 1
          fi
          highest=$(git tag -l 'v[0-9]*' --sort=-v:refname | awk '!/-/' | head -1)
          {
            echo "latest=$([ "$TAG" = "$highest" ] && echo true || echo false)"
            echo "version=${TAG#v}"
            echo "tag=$TAG"
            echo publish=true
          } >> "$GITHUB_OUTPUT"

  # Publishes ghcr.io/janbjorge/straum for amd64 and arm64, each built on
  # its own native runner, since under emulation the Rust build crawls,
  # as X.Y.Z, X.Y and, from the gate, latest. The OCI labels and
  # index annotations come from the repository's description and license;
  # provenance and SBOM attestations are signed through GitHub OIDC.
  publish:
    needs: [gate, format, lint, architecture, test, coverage, chart, image]
    if: needs.gate.outputs.publish == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      sbom: true
      build-args: STRAUM_VERSION=${{ needs.gate.outputs.version }}
      meta-images: ghcr.io/janbjorge/straum
      # type=semver reads the tag only on a tag push, so a release passes it.
      # flavor latest=false keeps metadata-action from adding latest itself.
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=latest,enable=${{ needs.gate.outputs.latest }}
        type=semver,pattern={{version}},value=${{ needs.gate.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.tag }}
      set-meta-labels: true
      set-meta-annotations: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Fills the release: the binaries copied out of the image just published,
  # so they are the bytes the image runs, their sums, and signed provenance
  # attestations for them and the image. The notes gain the image digest
  # and how to verify.
  release:
    if: github.event_name == 'release'
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Copy the binaries out of the image
        run: |
          mkdir dist
          for pair in amd64:x86_64 arm64:aarch64; do
            container=$(docker create --platform "linux/${pair%%:*}" "ghcr.io/janbjorge/straum@$DIGEST")
            docker cp "$container:/straum" "dist/straum-${pair#*:}-unknown-linux-musl"
            docker rm "$container"
          done
          case $(file -b dist/straum-x86_64-unknown-linux-musl) in
            *x86-64*static*) ;;
            *) echo "::error::the amd64 binary is not static x86-64"; exit 1 ;;
          esac
          case $(file -b dist/straum-aarch64-unknown-linux-musl) in
            *aarch64*static*) ;;
            *) echo "::error::the arm64 binary is not static aarch64"; exit 1 ;;
          esac
          test "$(dist/straum-x86_64-unknown-linux-musl version)" = "straum $VERSION"
          (cd dist && sha256sum straum-* > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/straum-*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/janbjorge/straum
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
      - name: Attach the binaries and extend the notes
        run: |
          gh release upload "$TAG" dist/*
          gh release view "$TAG" --json body --jq .body > notes.md
          fence='```'
          cat >> notes.md <<NOTES

          ## Image

          ${fence}sh
          docker pull ghcr.io/janbjorge/straum:$VERSION
          docker pull ghcr.io/janbjorge/straum@$DIGEST
          ${fence}

          ## Verify

          ${fence}sh
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify straum-x86_64-unknown-linux-musl --repo $GH_REPO
          gh attestation verify oci://ghcr.io/janbjorge/straum:$VERSION --repo $GH_REPO
          ${fence}
          NOTES
          gh release edit "$TAG" --notes-file notes.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # mdBook's release binary, checked against its sum when it was pinned.
      - name: Install mdBook
        run: |
          tarball=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$tarball"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $tarball" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  # Publishes the guide to GitHub Pages; the repository's Pages source must
  # be GitHub Actions.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
