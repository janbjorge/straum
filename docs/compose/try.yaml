# Try it on your data. In the directory that holds usage.sql, with
# DATABASE_URL set to a role that can SELECT the spec's tables:
# curl -fsSLO https://raw.githubusercontent.com/janbjorge/straum/main/docs/compose/try.yaml
# docker compose -f try.yaml run --rm shell
# PostgreSQL 18 starts with logical decoding on. straum plan --copy
# writes the copy scripts, psql runs export.sql on DATABASE_URL and
# load.sql on that PostgreSQL, straum plan writes the setup SQL and psql
# runs it, then Straum starts. The shell waits until Straum is healthy.
# The project name is straum-try.
#
# ${PWD} is the directory you ran from, so usage.sql is found there
# wherever this file is. host.docker.internal reaches the host,
# including on Linux.
name: straum-try

services:
  postgres:
    image: postgres:18
    # wal_level is on from the start, so the setup SQL's ALTER SYSTEM
    # needs no restart.
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Writes export.sql and load.sql into the copy volume. The image runs
  # as a user who cannot create a file on a new volume, so this runs as
  # root.
  scripts:
    image: ghcr.io/janbjorge/straum
    user: "0"
    restart: "no"
    volumes:
      - type: bind
        source: ${PWD}/usage.sql
        target: /usage.sql
        read_only: true
        bind:
          create_host_path: false
      - copy:/copy
    command: ["plan", "/usage.sql", "--copy", "/copy"]

  # Reads one snapshot of the columns the spec reads from DATABASE_URL,
  # and writes nothing there. host.docker.internal is the machine Docker
  # runs on.
  export:
    image: postgres:18
    depends_on:
      scripts:
        condition: service_completed_successfully
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - copy:/copy
    command: ["psql", "${DATABASE_URL:?set DATABASE_URL}", "-f", "/copy/export.sql"]

  load:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
      export:
        condition: service_completed_successfully
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
    volumes:
      - copy:/copy:ro
    command: ["psql", "-f", "/copy/load.sql"]

  # As root, as scripts does, to write the setup SQL on a new volume.
  plan:
    image: ghcr.io/janbjorge/straum
    user: "0"
    depends_on:
      load:
        condition: service_completed_successfully
    restart: "no"
    environment:
      STRAUM_DSN: postgres://straum:straum@postgres:5432/postgres?sslmode=disable
    volumes:
      - type: bind
        source: ${PWD}/usage.sql
        target: /usage.sql
        read_only: true
        bind:
          create_host_path: false
      - setup:/setup
    command: ["plan", "/usage.sql", "--wal", "logical", "--out", "/setup/setup.sql"]

  apply:
    image: postgres:18
    depends_on:
      plan:
        condition: service_completed_successfully
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
    volumes:
      - setup:/setup:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/setup/setup.sql"]

  straum:
    image: ghcr.io/janbjorge/straum
    depends_on:
      apply:
        condition: service_completed_successfully
    # Only these Host names, so a page rebound to 127.0.0.1 can't ask.
    command:
      - run
      - /usage.sql
      - --wal
      - logical
      - --listen
      - 0.0.0.0:8080
      - --allow-hosts
      - localhost:8080,127.0.0.1:8080,straum:8080
    environment:
      STRAUM_DSN: postgres://straum:straum@postgres:5432/postgres?sslmode=disable
    volumes:
      - type: bind
        source: ${PWD}/usage.sql
        target: /usage.sql
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:8080:8080
    # The image has no shell. status exits 0 once /readyz says ready.
    # A large copy can take a while to load, so the wait is an hour.
    healthcheck:
      test: ["CMD", "/straum", "status"]
      interval: 1s
      timeout: 15s
      retries: 30
      start_period: 1h

  # `run` starts this after Straum is healthy and attaches the terminal.
  # A profile keeps `up` from starting it, since it would take no input.
  shell:
    image: ghcr.io/janbjorge/straum
    profiles: ["shell"]
    depends_on:
      straum:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["shell", "--url", "http://straum:8080"]

volumes:
  copy:
  setup:
