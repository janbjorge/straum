<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590" role="img" aria-labelledby="t d">
  <title id="t">The running system</title>
  <desc id="d">A Writer owns the Source port and an App. App is a State behind an RwLock, which clones share. State holds the Store, a Following while every table is loaded with its applied LSN, commit time, Lag and last WAL reading, an optional Spilling with the Spill port, the Limits and the last Failure. The Source hands the Writer commits, each a transaction's changes.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="589" rx="10"/>
  <text x="32" y="42" class="title">The running system</text>
  <text x="32" y="64" class="sub muted">Arrows are dependency. Following exists only while every table is loaded.</text>
  <rect class="box" x="40" y="100" width="140" height="60" rx="8"/>
  <text x="52" y="122" class="h">Writer</text>
  <text x="52" y="140" class="s ink2">one per app</text>
  <rect class="box" x="250" y="100" width="140" height="60" rx="8"/>
  <text x="262" y="122" class="h">App</text>
  <text x="262" y="140" class="s ink2">clones share it</text>
  <rect class="box" x="460" y="100" width="140" height="60" rx="8"/>
  <text x="472" y="122" class="h">State</text>
  <text x="472" y="140" class="s ink2">behind an RwLock</text>
  <rect class="box2" x="720" y="100" width="130" height="46" rx="8"/>
  <text x="732" y="122" class="h">Store</text>
  <rect class="box" x="500" y="200" width="150" height="76" rx="8"/>
  <text x="512" y="222" class="h">Following</text>
  <text x="512" y="240" class="s ink2">applied LSN,</text>
  <text x="512" y="256" class="s ink2">committed at</text>
  <rect class="box2" x="720" y="200" width="130" height="46" rx="8"/>
  <text x="732" y="222" class="h">Lag</text>
  <rect class="box2" x="720" y="260" width="130" height="46" rx="8"/>
  <text x="732" y="282" class="h">Wal</text>
  <rect class="box" x="500" y="330" width="150" height="46" rx="8"/>
  <text x="512" y="352" class="h">Spilling</text>
  <rect class="planbox" x="720" y="330" width="130" height="46" rx="8"/>
  <text x="732" y="352" class="h plantext">Spill (port)</text>
  <rect class="box" x="500" y="410" width="150" height="60" rx="8"/>
  <text x="512" y="432" class="h">Limits</text>
  <text x="512" y="448" class="mono muted" text-anchor="start">--max-lag,</text>
  <text x="512" y="462" class="mono muted" text-anchor="start">--max-retained-wal</text>
  <rect class="box" x="500" y="500" width="150" height="60" rx="8"/>
  <text x="512" y="522" class="h">Failure</text>
  <text x="512" y="540" class="s ink2">the last one, kept</text>
  <text x="512" y="556" class="s ink2">across starts</text>
  <rect class="planbox" x="40" y="200" width="140" height="46" rx="8"/>
  <text x="52" y="222" class="h plantext">Source (port)</text>
  <rect class="box" x="40" y="330" width="140" height="60" rx="8"/>
  <text x="52" y="352" class="h">Commit</text>
  <text x="52" y="370" class="s ink2">one transaction, whole</text>
  <rect class="box" x="250" y="330" width="160" height="76" rx="8"/>
  <text x="262" y="352" class="h">Change</text>
  <text x="262" y="370" class="s ink2">insert, update, delete,</text>
  <text x="262" y="386" class="s ink2">truncate, unfit</text>
  <path class="a" d="M180 130 L246 130" marker-end="url(#m)"/>
  <text x="213" y="124" class="s ink2 halo" text-anchor="middle">1</text>
  <path class="a" d="M390 130 L456 130" marker-end="url(#m)"/>
  <text x="423" y="124" class="s ink2 halo" text-anchor="middle">1, RwLock</text>
  <path class="a" d="M600 123 L716 123" marker-end="url(#m)"/>
  <text x="658" y="117" class="s ink2 halo" text-anchor="middle">1</text>
  <path class="a" d="M478 160 L478 530"/>
  <path class="a" d="M478 238 L496 238" marker-end="url(#m)"/>
  <text x="470" y="242" class="s ink2 halo" text-anchor="end">0..1</text>
  <path class="a" d="M478 353 L496 353" marker-end="url(#m)"/>
  <text x="470" y="357" class="s ink2 halo" text-anchor="end">0..1</text>
  <path class="a" d="M478 440 L496 440" marker-end="url(#m)"/>
  <text x="470" y="444" class="s ink2 halo" text-anchor="end">1</text>
  <path class="a" d="M478 530 L496 530" marker-end="url(#m)"/>
  <text x="470" y="534" class="s ink2 halo" text-anchor="end">0..1</text>
  <path class="a" d="M650 223 L716 223" marker-end="url(#m)"/>
  <text x="683" y="217" class="s ink2 halo" text-anchor="middle">1</text>
  <path class="a" d="M650 253 L690 253 L690 283 L716 283" marker-end="url(#m)"/>
  <text x="696" y="275" class="s ink2 halo" text-anchor="start">1</text>
  <path class="a-plan" d="M650 353 L716 353" marker-end="url(#m-plan)"/>
  <path class="a" d="M110 160 L110 196" marker-end="url(#m)"/>
  <text x="118" y="182" class="s ink2 halo" text-anchor="start">1</text>
  <path class="a-plan" d="M110 246 L110 326" marker-end="url(#m-plan)"/>
  <text x="118" y="290" class="s ink2 halo" text-anchor="start">0..*, one at a time</text>
  <path class="a" d="M180 360 L246 360" marker-end="url(#m)"/>
  <text x="213" y="354" class="s ink2 halo" text-anchor="middle">1..*</text>
</svg>
