<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="t d">
  <title id="t">The running system</title>
  <desc id="d">A Writer owns the Source port, through which commits come one at a time, and an App. App holds the Spec, the Limits, a State behind an RwLock and a Progress behind a Mutex of its own, which clones share. State holds the Store and the LSN it is applied up to. Progress holds a Following while every table is loaded, with the applied LSN and its commit time, the Lag and the last WAL reading.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="409" rx="10"/>
  <text x="24" y="38" class="title">The running system</text>
  <text x="24" y="62" class="s muted">An arrow points at what a thing holds; each box says how many.</text>
  <rect class="box2" x="24" y="84" width="160" height="80" rx="8"/>
  <text x="38" y="109" class="h">Writer</text>
  <text x="38" y="130" class="s ink2">one, on its</text>
  <text x="38" y="149" class="s ink2">own thread</text>
  <rect class="planbox" x="24" y="194" width="160" height="80" rx="8"/>
  <text x="38" y="219" class="h">Source</text>
  <text x="38" y="240" class="s ink2">the port; Postgres</text>
  <text x="38" y="259" class="s ink2">behind it</text>
  <rect class="box" x="24" y="304" width="160" height="80" rx="8"/>
  <text x="38" y="329" class="h">Commit</text>
  <text x="38" y="350" class="s ink2">one at a time,</text>
  <text x="38" y="369" class="s ink2">one transaction</text>
  <rect class="box" x="220" y="84" width="216" height="80" rx="8"/>
  <text x="234" y="109" class="h">App</text>
  <text x="234" y="130" class="s ink2">clones share it;</text>
  <text x="234" y="149" class="s ink2">holds the Spec</text>
  <rect class="box" x="250" y="194" width="186" height="80" rx="8"/>
  <text x="264" y="219" class="h">Limits</text>
  <text x="264" y="240" class="mono ink2">--max-lag</text>
  <text x="264" y="259" class="mono ink2">--max-retained-wal</text>
  <rect class="box" x="470" y="84" width="226" height="80" rx="8"/>
  <text x="484" y="109" class="h">State</text>
  <text x="484" y="130" class="s ink2">one, behind the read-write</text>
  <text x="484" y="149" class="s ink2">lock, with the applied LSN</text>
  <rect class="box" x="500" y="184" width="196" height="60" rx="8"/>
  <text x="514" y="209" class="h">Store</text>
  <text x="514" y="230" class="s ink2">one</text>
  <rect class="box" x="250" y="304" width="186" height="80" rx="8"/>
  <text x="264" y="329" class="h">Progress</text>
  <text x="264" y="350" class="s ink2">one, behind a</text>
  <text x="264" y="369" class="s ink2">mutex of its own</text>
  <rect class="box" x="500" y="304" width="196" height="80" rx="8"/>
  <text x="514" y="329" class="h">Following</text>
  <text x="514" y="350" class="s ink2">0 or 1: applied LSN and</text>
  <text x="514" y="369" class="s ink2">its time, Lag, WAL reading</text>
  <path class="a" d="M184 124 H216" marker-end="url(#m)"/>
  <path class="a" d="M436 124 H466" marker-end="url(#m)"/>
  <path class="a" d="M104 164 V190" marker-end="url(#m)"/>
  <path class="a-plan" d="M104 274 V300" marker-end="url(#m-plan)"/>
  <text x="112" y="292" class="s muted halo" text-anchor="start">hands over</text>
  <path class="a" d="M234 164 V344"/>
  <path class="a" d="M234 234 H246" marker-end="url(#m)"/>
  <path class="a" d="M234 344 H246" marker-end="url(#m)"/>
  <path class="a" d="M484 164 V214"/>
  <path class="a" d="M484 214 H496" marker-end="url(#m)"/>
  <path class="a" d="M436 344 H496" marker-end="url(#m)"/>
</svg>
