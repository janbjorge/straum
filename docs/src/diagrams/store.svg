<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-labelledby="t d">
  <title id="t">What the store holds</title>
  <desc id="d">The store, one per process, holds one keyed rollup per fact, a bound rollup for some facts and one projection per dim. A rollup holds one level per width and codes per key column; a projection holds codes per attribute. A level holds buckets, hot or sealed; a hot bucket holds cells, which hold one state per input column: Count, Sum, Extent, Distinct or Bools.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="425" rx="10"/>
  <text x="24" y="38" class="title">What the store holds</text>
  <text x="24" y="62" class="s muted">An arrow points at what a thing holds; each box says how many.</text>
  <rect class="box2" x="24" y="84" width="120" height="80" rx="8"/>
  <text x="38" y="109" class="h">Store</text>
  <text x="38" y="130" class="s ink2">one per</text>
  <text x="38" y="149" class="s ink2">process</text>
  <rect class="box" x="180" y="84" width="170" height="80" rx="8"/>
  <text x="194" y="109" class="h">Rollup, keyed</text>
  <text x="194" y="130" class="s ink2">one per fact</text>
  <rect class="box" x="180" y="194" width="170" height="80" rx="8"/>
  <text x="194" y="219" class="h">Rollup, bound</text>
  <text x="194" y="240" class="s ink2">0 or 1 per fact</text>
  <rect class="box" x="180" y="304" width="170" height="80" rx="8"/>
  <text x="194" y="329" class="h">Projection</text>
  <text x="194" y="350" class="s ink2">one per dim</text>
  <rect class="box" x="386" y="84" width="140" height="80" rx="8"/>
  <text x="400" y="109" class="h">Level</text>
  <text x="400" y="130" class="s ink2">one per width</text>
  <rect class="box" x="386" y="224" width="140" height="80" rx="8"/>
  <text x="400" y="249" class="h">Codes</text>
  <text x="400" y="270" class="s ink2">per key column</text>
  <text x="400" y="289" class="s ink2">or attribute</text>
  <rect class="box" x="562" y="84" width="134" height="80" rx="8"/>
  <text x="576" y="109" class="h">Bucket</text>
  <text x="576" y="130" class="s ink2">many per level,</text>
  <text x="576" y="149" class="s ink2">Hot or Sealed</text>
  <rect class="box" x="562" y="194" width="134" height="80" rx="8"/>
  <text x="576" y="219" class="h">Cells</text>
  <text x="576" y="240" class="s ink2">one per hot</text>
  <text x="576" y="259" class="s ink2">bucket</text>
  <rect class="box" x="562" y="304" width="134" height="98" rx="8"/>
  <text x="576" y="329" class="h">State</text>
  <text x="576" y="350" class="s ink2">one per input</text>
  <text x="576" y="369" class="s ink2">column: Count,</text>
  <text x="576" y="388" class="s ink2">Sum, …</text>
  <path class="a" d="M144 124 H176" marker-end="url(#m)"/>
  <path class="a" d="M162 124 V344"/>
  <path class="a" d="M162 234 H176" marker-end="url(#m)"/>
  <path class="a" d="M162 344 H176" marker-end="url(#m)"/>
  <path class="a" d="M350 124 H382" marker-end="url(#m)"/>
  <path class="a" d="M350 150 H368 V194 H456 V220" marker-end="url(#m)"/>
  <path class="a" d="M350 254 H382" marker-end="url(#m)"/>
  <path class="a" d="M350 344 H368 V284 H382" marker-end="url(#m)"/>
  <path class="a" d="M526 124 H558" marker-end="url(#m)"/>
  <path class="a" d="M629 164 V190" marker-end="url(#m)"/>
  <path class="a" d="M629 274 V300" marker-end="url(#m)"/>
</svg>
