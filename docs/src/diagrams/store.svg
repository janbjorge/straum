<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-labelledby="t d">
  <title id="t">What the store holds</title>
  <desc id="d">The Store, one per process, holds a Rollup per fact, a Bound for a fact whose joins all read fact columns, and a Projection per dim. A Bound holds a Rollup of its own, keyed by dim values. A Rollup holds a Level per width, narrowest first, and Codes per key column; a Projection holds Codes per dim column. A Level maps each bucket start to its Cells, None for rows with no time. Cells hold the key codes, row counts, an Index and a State per input, columnar.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="447" rx="10"/>
  <text x="24" y="38" class="title">What the store holds</text>
  <text x="24" y="62" class="s muted">An arrow points at what a thing holds; each box says how many.</text>
  <rect class="box2" x="24" y="84" width="148" height="80" rx="8"/>
  <text x="38" y="109" class="h">Store</text>
  <text x="38" y="130" class="s ink2">one per process</text>
  <rect class="box" x="196" y="84" width="160" height="80" rx="8"/>
  <text x="210" y="109" class="h">Rollup</text>
  <text x="210" y="130" class="s ink2">one per fact, and</text>
  <text x="210" y="149" class="s ink2">one in each Bound</text>
  <rect class="box" x="196" y="194" width="160" height="80" rx="8"/>
  <text x="210" y="219" class="h">Bound</text>
  <text x="210" y="240" class="s ink2">0 or 1 per fact:</text>
  <text x="210" y="259" class="s ink2">cells by dim value</text>
  <rect class="box" x="196" y="304" width="160" height="80" rx="8"/>
  <text x="210" y="329" class="h">Projection</text>
  <text x="210" y="350" class="s ink2">one per dim: its</text>
  <text x="210" y="369" class="s ink2">key to dim codes</text>
  <rect class="box" x="380" y="84" width="152" height="80" rx="8"/>
  <text x="394" y="109" class="h">Level</text>
  <text x="394" y="130" class="s ink2">one per width,</text>
  <text x="394" y="149" class="s ink2">narrowest first</text>
  <rect class="box" x="380" y="304" width="152" height="80" rx="8"/>
  <text x="394" y="329" class="h">Codes</text>
  <text x="394" y="350" class="s ink2">one per key or</text>
  <text x="394" y="369" class="s ink2">dim column</text>
  <rect class="box" x="556" y="84" width="140" height="80" rx="8"/>
  <text x="570" y="109" class="h">Cells</text>
  <text x="570" y="130" class="s ink2">one per bucket:</text>
  <text x="570" y="149" class="s ink2">keys, rows, Index</text>
  <rect class="box" x="556" y="194" width="140" height="80" rx="8"/>
  <text x="570" y="219" class="h">State</text>
  <text x="570" y="240" class="s ink2">one per input:</text>
  <text x="570" y="259" class="s ink2">Count, Sum, …</text>
  <path class="a" d="M172 124 H192" marker-end="url(#m)"/>
  <path class="a" d="M184 124 V344"/>
  <path class="a" d="M184 234 H192" marker-end="url(#m)"/>
  <path class="a" d="M184 344 H192" marker-end="url(#m)"/>
  <path class="a" d="M276 194 V168" marker-end="url(#m)"/>
  <text x="284" y="184" class="s muted halo">its own</text>
  <path class="a" d="M356 112 H376" marker-end="url(#m)"/>
  <path class="a" d="M356 142 H368 V328 H376" marker-end="url(#m)"/>
  <path class="a" d="M356 360 H376" marker-end="url(#m)"/>
  <path class="a" d="M532 124 H552" marker-end="url(#m)"/>
  <path class="a" d="M626 164 V190" marker-end="url(#m)"/>
  <text x="24" y="408" class="s ink2">A level maps each bucket start to its cells, None for rows with no time.</text>
  <text x="24" y="429" class="s ink2">Cells are columnar: keys, row counts and each state side by side.</text>
</svg>
