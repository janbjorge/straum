<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">What the store holds</title>
  <desc id="d">A Store holds the Spec, one keyed Rollup per fact, a bound Rollup for a fact whose joins all read fact columns, and one Projection per dim. A Rollup holds one Level per width and one Codes per key column; a Level holds buckets, hot or sealed; a hot Bucket holds Cells, columnar, with one State per input column: Count, Sum, Extent or Distinct. A Projection maps dim keys to attribute codes.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="519" rx="10"/>
  <text x="32" y="42" class="title">What the store holds</text>
  <text x="32" y="64" class="sub muted">Arrows are dependency. A label says how many of the pointed-at thing one holds.</text>
  <rect class="box" x="40" y="100" width="130" height="340" rx="8"/>
  <text x="52" y="122" class="h">Store</text>
  <text x="52" y="140" class="s ink2">one per process,</text>
  <text x="52" y="156" class="s ink2">behind App's lock</text>
  <rect class="box2" x="270" y="100" width="130" height="46" rx="8"/>
  <text x="282" y="122" class="h">Spec</text>
  <rect class="box" x="270" y="180" width="150" height="76" rx="8"/>
  <text x="282" y="202" class="h">Rollup, keyed</text>
  <text x="282" y="220" class="s ink2">every cell of one fact,</text>
  <text x="282" y="236" class="s ink2">keyed by join columns</text>
  <rect class="box" x="270" y="290" width="150" height="76" rx="8"/>
  <text x="282" y="312" class="h">Rollup, bound</text>
  <text x="282" y="330" class="s ink2">keyed by the dim</text>
  <text x="282" y="346" class="s ink2">columns' values</text>
  <rect class="box" x="270" y="400" width="170" height="60" rx="8"/>
  <text x="282" y="422" class="h">Projection</text>
  <text x="282" y="440" class="s ink2">dim key → attribute codes</text>
  <rect class="box2" x="510" y="180" width="120" height="46" rx="8"/>
  <text x="522" y="202" class="h">Level</text>
  <text x="522" y="218" class="s ink2" text-anchor="start">one width</text>
  <rect class="box" x="510" y="290" width="120" height="60" rx="8"/>
  <text x="522" y="312" class="h">Codes</text>
  <text x="522" y="330" class="s ink2">values → ints</text>
  <rect class="box" x="700" y="180" width="150" height="60" rx="8"/>
  <text x="712" y="202" class="h">Bucket</text>
  <text x="712" y="220" class="s ink2">Hot or Sealed</text>
  <rect class="box" x="700" y="290" width="150" height="60" rx="8"/>
  <text x="712" y="312" class="h">Cells</text>
  <text x="712" y="330" class="s ink2">keys, counts, states</text>
  <rect class="box" x="700" y="400" width="150" height="76" rx="8"/>
  <text x="712" y="422" class="h">State</text>
  <text x="712" y="440" class="s ink2">Count, Sum, Extent</text>
  <text x="712" y="456" class="s ink2">or Distinct</text>
  <path class="a" d="M170 123 L266 123" marker-end="url(#m)"/>
  <text x="218" y="117" class="s ink2 halo" text-anchor="middle">1</text>
  <path class="a" d="M170 218 L266 218" marker-end="url(#m)"/>
  <text x="218" y="212" class="s ink2 halo" text-anchor="middle">1 per fact</text>
  <path class="a" d="M170 328 L266 328" marker-end="url(#m)"/>
  <text x="218" y="322" class="s ink2 halo" text-anchor="middle">0..1 per fact</text>
  <path class="a" d="M170 430 L266 430" marker-end="url(#m)"/>
  <text x="218" y="424" class="s ink2 halo" text-anchor="middle">1 per dim</text>
  <path class="a" d="M420 203 L506 203" marker-end="url(#m)"/>
  <text x="463" y="197" class="s ink2 halo" text-anchor="middle">1 per width</text>
  <path class="a" d="M420 240 L470 240 L470 310 L506 310" marker-end="url(#m)"/>
  <text x="476" y="268" class="s ink2 halo" text-anchor="start">1 per key column</text>
  <path class="a" d="M420 328 L506 328" marker-end="url(#m)"/>
  <path class="a" d="M440 430 L570 430 L570 354" marker-end="url(#m)"/>
  <text x="578" y="400" class="s ink2 halo" text-anchor="start">1 per attribute</text>
  <path class="a" d="M630 203 L696 203" marker-end="url(#m)"/>
  <text x="663" y="197" class="s ink2 halo" text-anchor="middle">0..*</text>
  <path class="a" d="M775 240 L775 286" marker-end="url(#m)"/>
  <text x="783" y="268" class="s ink2 halo" text-anchor="start">1 if hot</text>
  <path class="a" d="M775 350 L775 396" marker-end="url(#m)"/>
  <text x="767" y="378" class="s ink2 halo" text-anchor="end">1 per input column</text>
  <text x="32" y="488" class="s muted" text-anchor="start">Rows without a time go under a None bucket no ask reads. A cell goes with its last row.</text>
</svg>
