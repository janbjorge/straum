<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302" role="img" aria-labelledby="t d">
  <title id="t">A row adds to its cell, then is dropped</title>
  <desc id="d">The usage view at the 1 hour width. The cell for bucket 09:00, kind purchase and account 7 holds 1 event and an amount of 100.00. A row at 09:41:07 with kind purchase, account_id 7 and amount 120.00 has the same keys once its time is floored to 09:00, so it adds to that cell: 2 events, 220.00. The row itself is not kept; deleting it subtracts the same 1 and 120.00.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="301" rx="10"/>
  <text x="24" y="38" class="title">A row adds to its cell, then is dropped</text>
  <text x="24" y="62" class="s muted">The usage view at the 1 hour width.</text>
  <text x="156.0" y="116" class="lbl muted" text-anchor="middle">BUCKET</text>
  <text x="276.0" y="116" class="lbl muted" text-anchor="middle">KIND</text>
  <text x="406.0" y="116" class="lbl muted" text-anchor="middle">ACCOUNT_ID</text>
  <text x="531.0" y="116" class="lbl muted" text-anchor="middle">EVENTS</text>
  <text x="641.0" y="116" class="lbl muted" text-anchor="middle">AMOUNT</text>
  <rect class="box" x="96" y="128" width="600" height="38" rx="6"/>
  <text x="24" y="152" class="s muted" text-anchor="start">cell</text>
  <text x="156.0" y="152" class="mono ink2" text-anchor="middle">09:00</text>
  <text x="276.0" y="152" class="mono ink2" text-anchor="middle">purchase</text>
  <text x="406.0" y="152" class="mono ink2" text-anchor="middle">7</text>
  <text x="531.0" y="152" class="mono ink2" text-anchor="middle">1</text>
  <text x="641.0" y="152" class="mono ink2" text-anchor="middle">100.00</text>
  <rect class="box2" x="96" y="180" width="600" height="38" rx="6"/>
  <text x="24" y="204" class="s muted" text-anchor="start">+ row</text>
  <text x="156.0" y="204" class="mono" text-anchor="middle">at 09:41:07</text>
  <text x="276.0" y="204" class="mono" text-anchor="middle">purchase</text>
  <text x="406.0" y="204" class="mono" text-anchor="middle">7</text>
  <text x="531.0" y="204" class="mono" text-anchor="middle">1 row</text>
  <text x="641.0" y="204" class="mono" text-anchor="middle">120.00</text>
  <path class="a" d="M96 236 H696"/>
  <rect class="accbox" x="96" y="248" width="600" height="38" rx="6"/>
  <text x="24" y="272" class="s acc b" text-anchor="start">cell</text>
  <text x="156.0" y="272" class="mono acc b" text-anchor="middle">09:00</text>
  <text x="276.0" y="272" class="mono acc b" text-anchor="middle">purchase</text>
  <text x="406.0" y="272" class="mono acc b" text-anchor="middle">7</text>
  <text x="531.0" y="272" class="mono acc b" text-anchor="middle">2</text>
  <text x="641.0" y="272" class="mono acc b" text-anchor="middle">220.00</text>
  <path class="rule" d="M100 96 V90 H472 V96"/>
  <text x="286" y="94" class="s acc halo" text-anchor="middle">keys pick the cell</text>
  <path class="rule" d="M480 96 V90 H692 V96"/>
  <text x="586" y="94" class="s acc halo" text-anchor="middle">measures add up</text>
</svg>
