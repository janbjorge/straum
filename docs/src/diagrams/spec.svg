<svg xmlns="http://www.w3.org/2000/svg" width="720" height="578" viewBox="0 0 720 578" role="img" aria-labelledby="t d">
  <title id="t">What a spec declares</title>
  <desc id="d">A spec holds dims and facts. A dim names a table, its key and the attributes views read. A fact, one view, holds refs in join order, one time with its widths, by keys, measures and conditions. A ref points at a dim by name, joins through one via per key column and reads attributes. A measure has an aggregate and a filter; conditions are the view's WHERE and each FILTER.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="577" rx="10"/>
  <text x="24" y="38" class="title">What a spec declares</text>
  <text x="24" y="62" class="s muted">An arrow points at what a thing holds; each box says how many.</text>
  <rect class="box2" x="24" y="84" width="130" height="72" rx="8"/>
  <text x="38" y="109" class="h">Spec</text>
  <text x="38" y="130" class="s ink2">the whole file</text>
  <rect class="box" x="190" y="84" width="160" height="80" rx="8"/>
  <text x="204" y="109" class="h">Dim</text>
  <text x="204" y="130" class="s ink2">0 or more: a table,</text>
  <text x="204" y="149" class="s ink2">its key, attributes</text>
  <rect class="box" x="190" y="214" width="160" height="80" rx="8"/>
  <text x="204" y="239" class="h">Fact</text>
  <text x="204" y="260" class="s ink2">1 or more: one</text>
  <text x="204" y="279" class="s ink2">view, its table</text>
  <rect class="box" x="406" y="76" width="290" height="118" rx="8"/>
  <text x="420" y="101" class="h">Ref</text>
  <text x="420" y="122" class="s ink2">0 or more, in join order:</text>
  <text x="420" y="141" class="s ink2">alias; left, inner, semi or anti;</text>
  <text x="420" y="160" class="s ink2">a Via per key column of the</text>
  <text x="420" y="179" class="s ink2">Dim; the Attributes it reads</text>
  <rect class="box" x="406" y="214" width="290" height="60" rx="8"/>
  <text x="420" y="239" class="h">Time</text>
  <text x="420" y="260" class="s ink2">one: name, column, widths</text>
  <rect class="box" x="406" y="294" width="290" height="60" rx="8"/>
  <text x="420" y="319" class="h">ByKey</text>
  <text x="420" y="340" class="s ink2">0 or more: column, or IS NULL</text>
  <rect class="box" x="406" y="374" width="290" height="80" rx="8"/>
  <text x="420" y="399" class="h">Measure</text>
  <text x="420" y="420" class="s ink2">1 or more: name, aggregate,</text>
  <text x="420" y="439" class="s ink2">FILTER as Conditions</text>
  <rect class="box" x="406" y="474" width="290" height="80" rx="8"/>
  <text x="420" y="499" class="h">Condition</text>
  <text x="420" y="520" class="s ink2">the view's WHERE, each FILTER:</text>
  <text x="420" y="539" class="s ink2">on keys, such as key IN (…)</text>
  <path class="a" d="M154 116 H186" marker-end="url(#m)"/>
  <path class="a" d="M89 156 V254 H186" marker-end="url(#m)"/>
  <path class="a-cfg" d="M406 120 H354" marker-end="url(#m)"/>
  <text x="378" y="112" class="s ink2 halo" text-anchor="middle">names</text>
  <path class="a" d="M350 254 H402" marker-end="url(#m)"/>
  <path class="a" d="M388 254 V514"/>
  <path class="a" d="M388 160 V254"/>
  <path class="a" d="M388 160 H402" marker-end="url(#m)"/>
  <path class="a" d="M388 324 H402" marker-end="url(#m)"/>
  <path class="a" d="M388 414 H402" marker-end="url(#m)"/>
  <path class="a" d="M388 514 H402" marker-end="url(#m)"/>
</svg>
