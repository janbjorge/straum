<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-labelledby="t d">
  <title id="t">The load and the stream meet at one point, L</title>
  <desc id="d">A timeline of commits in PostgreSQL's WAL. Straum opens a temporary slot at L. Every commit up to L is in the snapshot, which Straum loads with one COPY per table while asks get 503. Every commit after L comes through the slot and is applied whole and in order, and asks are answered. No commit is missed and none is applied twice.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="311" rx="10"/>
  <text x="24" y="38" class="title">The load and the stream meet at one point, L</text>
  <text x="24" y="62" class="s muted">Each dot is a commit in PostgreSQL, oldest first.</text>
  <path class="rule" d="M24 150 L692 150"/>
  <circle class="fillink" cx="44" cy="150" r="5"/>
  <circle class="fillink" cx="76" cy="150" r="5"/>
  <circle class="fillink" cx="108" cy="150" r="5"/>
  <circle class="fillink" cx="140" cy="150" r="5"/>
  <circle class="fillink" cx="172" cy="150" r="5"/>
  <circle class="fillink" cx="204" cy="150" r="5"/>
  <circle class="fillink" cx="236" cy="150" r="5"/>
  <circle class="fillink" cx="268" cy="150" r="5"/>
  <circle class="fillink" cx="300" cy="150" r="5"/>
  <circle class="fillacc" cx="396" cy="150" r="5"/>
  <circle class="fillacc" cx="428" cy="150" r="5"/>
  <circle class="fillacc" cx="460" cy="150" r="5"/>
  <circle class="fillacc" cx="492" cy="150" r="5"/>
  <circle class="fillacc" cx="524" cy="150" r="5"/>
  <circle class="fillacc" cx="556" cy="150" r="5"/>
  <circle class="fillacc" cx="588" cy="150" r="5"/>
  <circle class="fillacc" cx="620" cy="150" r="5"/>
  <circle class="fillacc" cx="652" cy="150" r="5"/>
  <circle class="fillacc" cx="684" cy="150" r="5"/>
  <path class="rule" d="M34 116 V108 H334 V116"/>
  <text x="184" y="100" class="s ink2" text-anchor="middle">commits up to L: in the snapshot</text>
  <path class="rule" d="M354 116 V108 H686 V116"/>
  <text x="520" y="100" class="s acc" text-anchor="middle">commits after L: through the slot</text>
  <path class="life" d="M344 120 V292"/>
  <circle class="accbox" cx="344" cy="150" r="14"/>
  <text x="344" y="155" class="b acc" text-anchor="middle">L</text>
  <text x="344" y="186" class="s ink2 halo" text-anchor="middle">the slot opens here</text>
  <rect class="box" x="24" y="206" width="310" height="82" rx="8"/>
  <text x="38" y="231" class="h">Load</text>
  <text x="38" y="252" class="s ink2">one COPY per table, from the</text>
  <text x="38" y="271" class="s ink2">snapshot; asks answer 503</text>
  <rect class="accbox" x="354" y="206" width="342" height="82" rx="8"/>
  <text x="368" y="231" class="h acc">Follow</text>
  <text x="368" y="252" class="s ink2">each commit after L, whole and</text>
  <text x="368" y="271" class="s ink2">in order; asks are answered</text>
</svg>
