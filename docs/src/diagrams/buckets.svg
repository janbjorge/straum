  <title id="t">A row lands in one bucket per width</title>
  <desc id="d">A view keeping 1 hour, 1 day and 7 day buckets. A row at Friday 2026-11-13 09:41:07Z, t = 1794562867, is floored to each width, all aligned to 1970-01-01: the 7-day bucket from Thursday 2026-11-12, the day bucket Friday 2026-11-13 and the hour bucket 09:00, all in the same commit.</desc>
