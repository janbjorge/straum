<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img" aria-labelledby="t d">
  <title id="t">/readyz is 200 only while Straum keeps up</title>
  <desc id="d">Straum starts in Loading. Loading turns Ready once every table is loaded. Ready turns Lagging past --max-lag behind and back when it catches up; both answer asks. A failure in any of them ends the process with exit 1; whatever runs Straum starts a new one, which begins in Loading from a new slot. SIGTERM, in any state, leads to Stopping, which drains asks and exits.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="375" rx="10"/>
  <text x="24" y="38" class="title">/readyz is 200 only while Straum keeps up</text>
  <rect class="frame" x="270" y="80" width="220" height="276" rx="10"/>
  <text x="380" y="344" class="lbl acc" text-anchor="middle">ASKS ANSWERED</text>
  <circle class="fillink" cx="107" cy="70" r="6"/>
  <path class="a" d="M107 76 L107 92" marker-end="url(#m)"/>
  <rect class="box" x="24" y="96" width="166" height="74" rx="8"/>
  <text x="38" y="121" class="h">Loading</text>
  <text x="38" y="142" class="s ink2">every table, from</text>
  <text x="38" y="161" class="s ink2">a new slot</text>
  <rect class="accbox" x="286" y="96" width="188" height="74" rx="8"/>
  <text x="300" y="121" class="h acc">Ready</text>
  <text x="300" y="142" class="s ink2">applies commits</text>
  <text x="300" y="161" class="s ink2">and keeps up</text>
  <rect class="box" x="286" y="250" width="188" height="74" rx="8"/>
  <text x="300" y="275" class="h">Lagging</text>
  <text x="300" y="296" class="s ink2">more than</text>
  <text x="300" y="315" class="mono ink2">--max-lag behind</text>
  <rect class="errbox" x="24" y="250" width="166" height="74" rx="8"/>
  <text x="38" y="275" class="h err">Exited</text>
  <text x="38" y="296" class="s ink2">exit 1, until</text>
  <text x="38" y="315" class="s ink2">started again</text>
  <rect class="box" x="556" y="172" width="140" height="74" rx="8"/>
  <text x="570" y="197" class="h">Stopping</text>
  <text x="570" y="218" class="s ink2">drains asks,</text>
  <text x="570" y="237" class="s ink2">then exits</text>
  <text x="626" y="268" class="s muted" text-anchor="middle">from any state</text>
  <path class="a-acc" d="M190 133 L282 133" marker-end="url(#m-acc)"/>
  <text x="230" y="125" class="s ink2 halo" text-anchor="middle">loaded</text>
  <path class="a" d="M340 170 L340 246" marker-end="url(#m)"/>
  <text x="346" y="200" class="s ink2 halo" text-anchor="start">behind</text>
  <path class="a" d="M420 250 L420 174" marker-end="url(#m)"/>
  <text x="414" y="226" class="s ink2 halo" text-anchor="end">caught up</text>
  <path class="a-err" d="M80 170 L80 246" marker-end="url(#m-err)"/>
  <text x="72" y="212" class="s err halo" text-anchor="end">failure</text>
  <path class="a" d="M140 250 L140 174" marker-end="url(#m)"/>
  <text x="146" y="216" class="s ink2 halo" text-anchor="start">a new</text>
  <text x="146" y="234" class="s ink2 halo" text-anchor="start">process</text>
  <path class="a-err" d="M270 300 L194 300" marker-end="url(#m-err)"/>
  <text x="232" y="292" class="s err halo" text-anchor="middle">failure</text>
  <path class="a" d="M490 209 L552 209" marker-end="url(#m)"/>
  <text x="521" y="201" class="mono ink2 halo" text-anchor="middle">SIGTERM</text>
</svg>
