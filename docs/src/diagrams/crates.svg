<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
  <title id="t">Crates depend inward only</title>
  <desc id="d">Eight crates: the straum binary on top depends on four adapters, straum-notation, straum-pg, straum-http and straum-feed; a second binary, straum-parquet, depends on straum-feed; the adapters depend on straum-app, which holds the use cases and the ports Source and Spill; everything depends on straum-domain, which has no I/O and no dependencies.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="599" rx="10"/>
  <text x="32" y="42" class="title">Crates depend inward only</text>
  <text x="32" y="64" class="sub muted">An arrow is “depends on”. scripts/check-layers.py refuses any other edge.</text>
  <rect class="box" x="150" y="92" width="320" height="66" rx="8"/>
  <text x="162" y="114" class="h">straum</text>
  <text x="162" y="132" class="s ink2">the binary, the composition root</text>
  <text x="162" y="148" class="s ink2">run · plan · status · the writer thread</text>
  <rect class="box" x="600" y="92" width="256" height="66" rx="8"/>
  <text x="612" y="114" class="h">straum-parquet</text>
  <text x="612" y="132" class="s ink2">a second binary, a feeder:</text>
  <text x="612" y="148" class="s ink2">Parquet files and their manifest</text>
  <rect class="box" x="24" y="220" width="196" height="86" rx="8"/>
  <text x="36" y="242" class="h">straum-notation</text>
  <text x="36" y="260" class="s ink2">Straum SQL into Spec and Ask</text>
  <text x="36" y="276" class="s ink2">walks the sqlparser AST</text>
  <rect class="box" x="236" y="220" width="196" height="86" rx="8"/>
  <text x="248" y="242" class="h">straum-pg</text>
  <text x="248" y="260" class="s ink2">Source: temporary slot,</text>
  <text x="248" y="276" class="s ink2">binary COPY, pgoutput, WAL</text>
  <rect class="box" x="448" y="220" width="196" height="86" rx="8"/>
  <text x="460" y="242" class="h">straum-http</text>
  <text x="460" y="260" class="s ink2">POST /ask, /readyz, /status</text>
  <text x="460" y="276" class="s ink2">tokio and hyper, only async</text>
  <rect class="box" x="660" y="220" width="196" height="86" rx="8"/>
  <text x="672" y="242" class="h">straum-feed</text>
  <text x="672" y="260" class="s ink2">Source: a Unix socket and</text>
  <text x="672" y="276" class="s ink2">its frames, both ends</text>
  <rect class="accbox" x="320" y="370" width="240" height="86" rx="8"/>
  <text x="332" y="392" class="h acc">straum-app</text>
  <text x="332" y="410" class="s ink2">App, Writer, Status, Lag</text>
  <text x="332" y="426" class="s ink2">ports: Source and Spill</text>
  <rect class="box2" x="290" y="510" width="300" height="66" rx="8"/>
  <text x="302" y="532" class="h">straum-domain</text>
  <text x="302" y="550" class="s ink2">Spec, Ask, Store, Rollup, Projection,</text>
  <text x="302" y="566" class="s ink2">Sealed, Answer; no I/O, no dependencies</text>
  <path class="a" d="M230 158 L122 216" marker-end="url(#m)"/>
  <path class="a" d="M310 158 L334 216" marker-end="url(#m)"/>
  <path class="a" d="M390 158 L546 216" marker-end="url(#m)"/>
  <path class="a" d="M450 158 L700 216" marker-end="url(#m)"/>
  <path class="a" d="M760 158 L790 216" marker-end="url(#m)"/>
  <path class="a-acc" d="M334 306 L400 366" marker-end="url(#m-acc)"/>
  <text x="318" y="344" class="s acc" text-anchor="end">Source</text>
  <path class="a-acc" d="M546 306 L500 366" marker-end="url(#m-acc)"/>
  <text x="534" y="344" class="s acc" text-anchor="start">App</text>
  <path class="a-acc" d="M758 306 L564 398" marker-end="url(#m-acc)"/>
  <text x="690" y="358" class="s acc" text-anchor="start">Source</text>
  <path class="a" d="M440 456 L440 506" marker-end="url(#m)"/>
  <path class="a" d="M122 306 L122 543 L286 543" marker-end="url(#m)"/>
  <text x="134" y="420" class="s ink2" text-anchor="start">Spec, Ask</text>
  <text x="600" y="420" class="s muted" text-anchor="start">straum-http never sees Straum SQL:</text>
  <text x="600" y="436" class="s muted" text-anchor="start">the binary hands it a query reader.</text>
  <text x="600" y="452" class="s muted" text-anchor="start">straum-parquet meets Straum only over</text>
  <text x="600" y="468" class="s muted" text-anchor="start">the feed. Edges from a binary or an</text>
  <text x="600" y="484" class="s muted" text-anchor="start">adapter straight to app or domain are</text>
  <text x="600" y="500" class="s muted" text-anchor="start">left out.</text>
</svg>
