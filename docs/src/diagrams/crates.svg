<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img" aria-labelledby="t d">
  <title id="t">Crates depend inward only</title>
  <desc id="d">Six crates. The straum binary depends on the three adapters: straum-notation, straum-pg and straum-http, and on straum-app. straum-pg and straum-http depend on straum-app, which holds the use cases and the ports Source and Spill. Every crate depends on straum-domain, which has no I/O and no dependencies.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="475" rx="10"/>
  <text x="24" y="38" class="title">Crates depend inward only</text>
  <text x="24" y="62" class="s muted">An arrow is “depends on”. The binary also uses straum-app.</text>
  <rect class="box" x="250" y="84" width="220" height="60" rx="8"/>
  <text x="264" y="109" class="h mono">straum</text>
  <text x="264" y="130" class="s ink2">the binary</text>
  <rect class="box" x="24" y="196" width="204" height="80" rx="8"/>
  <text x="38" y="221" class="h mono">straum-notation</text>
  <text x="38" y="242" class="s ink2">Straum SQL into</text>
  <text x="38" y="261" class="s ink2">Spec and Ask</text>
  <rect class="box" x="258" y="196" width="204" height="80" rx="8"/>
  <text x="272" y="221" class="h mono">straum-pg</text>
  <text x="272" y="242" class="s ink2">the Source adapter:</text>
  <text x="272" y="261" class="s ink2">slot, COPY, pgoutput</text>
  <rect class="box" x="492" y="196" width="204" height="80" rx="8"/>
  <text x="506" y="221" class="h mono">straum-http</text>
  <text x="506" y="242" class="s ink2">the HTTP endpoints,</text>
  <text x="506" y="261" class="s ink2">the only tokio</text>
  <rect class="accbox" x="258" y="312" width="204" height="80" rx="8"/>
  <text x="272" y="337" class="h mono acc">straum-app</text>
  <text x="272" y="358" class="s ink2">use cases, Writer</text>
  <text x="272" y="377" class="s ink2">ports: Source, Spill</text>
  <rect class="box2" x="24" y="412" width="672" height="44" rx="8"/>
  <text x="38" y="440" class="h mono" text-anchor="start">straum-domain</text>
  <text x="184" y="440" class="s ink2" text-anchor="start">every crate uses it; no I/O, no dependencies</text>
  <path class="a" d="M300 144 L130 192" marker-end="url(#m)"/>
  <path class="a" d="M360 144 L360 192" marker-end="url(#m)"/>
  <path class="a" d="M420 144 L590 192" marker-end="url(#m)"/>
  <path class="a" d="M360 276 L360 308" marker-end="url(#m)"/>
  <path class="a" d="M594 276 V352 H466" marker-end="url(#m)"/>
</svg>
