  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="553" rx="10"/>
  <text x="24" y="38" class="title">Straum keeps the pages it reads, so a record becomes a row</text>
  <text x="24" y="62" class="s muted">The physical WAL from the last checkpoint, read for page 12 of public.events.</text>
  <text x="24" y="98" class="lbl muted">WAL RECORD</text>
  <text x="276" y="98" class="lbl acc">STRAUM'S PAGE 12</text>
  <text x="496" y="98" class="lbl muted">TO THE WRITER</text>
  <rect class="box2" x="24" y="110" width="232" height="62" rx="6"/>
  <text x="36" y="135" class="b">checkpoint</text>
  <text x="36" y="155" class="s muted">the stream starts at its redo point</text>
  <text x="288" y="146" class="s muted it">nothing held yet</text>
  <rect class="box" x="24" y="182" width="232" height="62" rx="6"/>
  <text x="36" y="207" class="b">full image of page 12</text>
  <text x="36" y="227" class="s muted">its first change since then</text>
  <rect class="accbox" x="276" y="182" width="200" height="62" rx="6"/>
  <text x="288" y="207" class="mono ink2">1  7  purchase  220.00</text>
  <text x="288" y="227" class="mono ink2">2  9  purchase  40.00</text>
  <path class="a-acc" d="M259 213 L271 213" marker-end="url(#m-acc)"/>
  <rect class="frame" x="24" y="254" width="232" height="62" rx="6"/>
  <text x="36" y="279" class="muted">page 88 of another table</text>
  <text x="36" y="299" class="s muted">header read, passed by</text>
  <text x="288" y="290" class="s muted it">unchanged</text>
  <rect class="box" x="24" y="326" width="232" height="62" rx="6"/>
  <text x="36" y="351" class="b">update page 12, slot 2</text>
  <text x="36" y="371" class="s muted">only the bytes that changed</text>
  <rect class="accbox" x="276" y="326" width="200" height="62" rx="6"/>
  <text x="288" y="351" class="mono ink2">1  7  purchase  220.00</text>
  <text x="288" y="371" class="mono ink2">2  9  purchase  <tspan class="acc b">55.00</tspan></text>
  <path class="a-acc" d="M259 357 L271 357" marker-end="url(#m-acc)"/>
  <rect class="frame" x="496" y="326" width="200" height="62" rx="6"/>
  <text x="508" y="351" class="s ink2">old and new row,</text>
  <text x="508" y="371" class="s ink2">held for xid 731</text>
  <path class="a" d="M479 357 L491 357" marker-end="url(#m)"/>
  <rect class="box" x="24" y="398" width="232" height="62" rx="6"/>
  <text x="36" y="423" class="b">commit xid 731</text>
  <text x="36" y="443" class="s muted">an abort would drop it</text>
  <rect class="accbox" x="496" y="398" width="200" height="62" rx="6"/>
  <text x="508" y="417" class="mono acc b">update</text>
  <text x="508" y="435" class="mono ink2">old 9 purchase 40.00</text>
  <text x="508" y="453" class="mono ink2">new 9 purchase 55.00</text>
  <path class="a" d="M596 390 L596 394" marker-end="url(#m)"/>
  <path class="a" d="M259 429 L491 429" marker-end="url(#m)"/>
  <path class="rule" d="M24 482 H696"/>
  <text x="24" y="510" class="s ink2">The copy goes at the next checkpoint past the page's last change,</text>
  <text x="24" y="532" class="s ink2">since PostgreSQL then logs the page whole again.</text>
</svg>
