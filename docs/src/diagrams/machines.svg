<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="t d">
  <title id="t">Three small state machines</title>
  <desc id="d">The source: Closed to Loading on open, Loading to Streaming on the first next_commit, back to Closed on the next open. A bucket: Hot to Sealed by a seal pass once it ended seal_after ago, back to Hot when a change touches it, gone when its last row is removed. The bound cells of a bucket: Bound while the bucket is hot, Out once it is sealed, bound again as the dims are then when it is unsealed.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="339" rx="10"/>
  <text x="32" y="42" class="title">Three small state machines</text>
  <text x="32" y="64" class="sub muted">The source connection, a date_bin bucket, and a bucket's bound cells.</text>
  <text x="40" y="104" class="lbl muted" text-anchor="start">THE SOURCE</text>
  <rect class="box" x="40" y="120" width="90" height="40" rx="8"/>
  <text x="85.0" y="145" class="h" text-anchor="middle">Closed</text>
  <rect class="box" x="40" y="200" width="90" height="40" rx="8"/>
  <text x="85.0" y="225" class="h" text-anchor="middle">Loading</text>
  <rect class="box" x="40" y="280" width="110" height="40" rx="8"/>
  <text x="95.0" y="305" class="h" text-anchor="middle">Streaming</text>
  <path class="a" d="M85 160 L85 196" marker-end="url(#m)"/>
  <text x="93" y="182" class="s ink2 halo" text-anchor="start">open</text>
  <path class="a" d="M85 240 L85 276" marker-end="url(#m)"/>
  <text x="93" y="262" class="mono ink2" text-anchor="start">next_commit</text>
  <path class="a" d="M150 300 L190 300 L190 140 L134 140" marker-end="url(#m)"/>
  <text x="196" y="176" class="s ink2 halo" text-anchor="start">open</text>
  <path class="a" d="M130 220 L190 220"/>
  <text x="330" y="104" class="lbl muted" text-anchor="start">A DATE_BIN BUCKET</text>
  <rect class="accbox" x="330" y="120" width="90" height="40" rx="8"/>
  <text x="375.0" y="145" class="h acc" text-anchor="middle">Hot</text>
  <rect class="box" x="330" y="240" width="90" height="40" rx="8"/>
  <text x="375.0" y="265" class="h" text-anchor="middle">Sealed</text>
  <path class="a" d="M352 160 L352 236" marker-end="url(#m)"/>
  <path class="a" d="M398 236 L398 160" marker-end="url(#m)"/>
  <text x="410" y="180" class="s ink2" text-anchor="start">down: a seal pass, once it</text>
  <text x="410" y="196" class="s ink2" text-anchor="start">ended --seal-after ago</text>
  <text x="410" y="220" class="s ink2" text-anchor="start">up: a change touches it,</text>
  <text x="410" y="236" class="s ink2" text-anchor="start">before the change applies</text>
  <text x="330" y="300" class="s muted" text-anchor="start">gone with its last row, or when</text>
  <text x="330" y="316" class="s muted" text-anchor="start">the fact is truncated</text>
  <text x="600" y="104" class="lbl muted" text-anchor="start">BOUND CELLS OF A BUCKET</text>
  <rect class="accbox" x="600" y="120" width="100" height="40" rx="8"/>
  <text x="650.0" y="145" class="h acc" text-anchor="middle">Bound</text>
  <rect class="errbox" x="600" y="240" width="100" height="40" rx="8"/>
  <text x="650.0" y="265" class="h err" text-anchor="middle">Out</text>
  <path class="a-err" d="M625 160 L625 236" marker-end="url(#m-err)"/>
  <path class="a" d="M675 236 L675 160" marker-end="url(#m)"/>
  <text x="710" y="180" class="s ink2" text-anchor="start">down: its bucket</text>
  <text x="710" y="196" class="s ink2" text-anchor="start">is sealed</text>
  <text x="710" y="220" class="s ink2" text-anchor="start">up: it is unsealed, bound</text>
  <text x="710" y="236" class="s ink2" text-anchor="start">as the dims are then</text>
  <text x="600" y="300" class="s muted" text-anchor="start">only a fact whose joins all read</text>
  <text x="600" y="316" class="s muted" text-anchor="start">fact columns has them</text>
</svg>
