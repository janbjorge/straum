<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-labelledby="t d">
  <title id="t">Three small state machines</title>
  <desc id="d">The source: Closed to Loading on open, Loading to Streaming on the first next_commit, back to Closed on the next open, which closes it first. A date_bin bucket: Hot to Sealed by a seal pass, back to Hot when a change touches it; either goes with its last row or a truncate. A bucket's bound cells: Bound while it is hot, Out once it is sealed, bound again as the dims are then when it is unsealed.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="447" rx="10"/>
  <text x="24" y="38" class="title">Three small state machines</text>
  <text x="24" y="82" class="lbl muted" text-anchor="start">THE SOURCE CONNECTION</text>
  <rect class="box" x="24" y="96" width="140" height="46" rx="8"/>
  <text x="94.0" y="124.0" class="h" text-anchor="middle">Closed</text>
  <rect class="box" x="250" y="96" width="140" height="46" rx="8"/>
  <text x="320.0" y="124.0" class="h" text-anchor="middle">Loading</text>
  <rect class="accbox" x="540" y="96" width="140" height="46" rx="8"/>
  <text x="610.0" y="124.0" class="h acc" text-anchor="middle">Streaming</text>
  <path class="a" d="M164 119 H246" marker-end="url(#m)"/>
  <text x="207" y="111" class="mono ink2 halo" text-anchor="middle">open</text>
  <path class="a" d="M390 119 H536" marker-end="url(#m)"/>
  <text x="465" y="111" class="mono ink2 halo" text-anchor="middle">next_commit</text>
  <text x="465" y="137" class="s muted halo" text-anchor="middle">the first</text>
  <path class="a" d="M610 142 V166 H94 V146" marker-end="url(#m)"/>
  <path class="a" d="M320 142 V166"/>
  <text x="352" y="186" class="s ink2 halo" text-anchor="middle">open again: it closes the stream first</text>
  <text x="24" y="230" class="lbl muted" text-anchor="start">A DATE_BIN BUCKET</text>
  <rect class="accbox" x="24" y="244" width="140" height="46" rx="8"/>
  <text x="94.0" y="272.0" class="h acc" text-anchor="middle">Hot</text>
  <rect class="box" x="376" y="244" width="140" height="46" rx="8"/>
  <text x="446.0" y="272.0" class="h" text-anchor="middle">Sealed</text>
  <path class="a" d="M164 258 H372" marker-end="url(#m)"/>
  <text x="268" y="250" class="s ink2 halo" text-anchor="middle">a seal pass, once it is old</text>
  <path class="a" d="M376 278 H168" marker-end="url(#m)"/>
  <text x="268" y="298" class="s ink2 halo" text-anchor="middle">a change touches it</text>
  <text x="536" y="262" class="s muted" text-anchor="start">either goes with its</text>
  <text x="536" y="281" class="s muted" text-anchor="start">last row or a truncate</text>
  <text x="24" y="344" class="lbl muted" text-anchor="start">A BUCKET'S BOUND CELLS</text>
  <rect class="accbox" x="24" y="358" width="140" height="46" rx="8"/>
  <text x="94.0" y="386.0" class="h acc" text-anchor="middle">Bound</text>
  <rect class="box" x="376" y="358" width="140" height="46" rx="8"/>
  <text x="446.0" y="386.0" class="h" text-anchor="middle">Out</text>
  <path class="a" d="M164 372 H372" marker-end="url(#m)"/>
  <text x="268" y="364" class="s ink2 halo" text-anchor="middle">its bucket is sealed</text>
  <path class="a" d="M376 392 H168" marker-end="url(#m)"/>
  <text x="268" y="412" class="s ink2 halo" text-anchor="middle">unsealed: bound again</text>
  <text x="536" y="376" class="s muted" text-anchor="start">only for a view whose</text>
  <text x="536" y="395" class="s muted" text-anchor="start">joins read fact columns</text>
</svg>
