<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-labelledby="t d">
  <title id="t">An ask reads 21 buckets instead of 234</title>
  <desc id="d">An ask from Tuesday 2026-11-17 06:00 to Friday 2026-11-27 00:00 over a view keeping 1 hour, 1 day and 7 day buckets. The 7-day width takes the one whole bucket inside the range, Thursday 19 to Thursday 26. What is left at each end falls to the day width, Wednesday 18 and Thursday 26, and the rest to the hour width, 18 buckets from 06:00 on Tuesday 17. 21 buckets are read instead of 234 hour buckets.</desc>
