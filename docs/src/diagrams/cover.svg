  <text x="668.5" y="230" class="b acc" text-anchor="middle">Thu 26</text>
  <text x="180.5" y="199" class="lbl acc" text-anchor="middle">read 2</text>
  <text x="668.5" y="199" class="lbl acc" text-anchor="middle">read 4</text>
