<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d">
  <title id="t">How an ask range is read</title>
  <desc id="d">An ask from Tuesday 2024-01-16 06:00 to Friday 2024-01-26 00:00 over a view keeping 1 hour, 1 day and 7 day buckets. The 7-day level takes the one whole bucket inside the range, Thursday 18 to Thursday 25. What is left at each end falls to the day level, Wednesday 17 and Thursday 25, and the rest to the hour level, 18 buckets from 06:00 on Tuesday 16. 21 buckets are read instead of 234 hour buckets. An ask grouped by bucket reads the hour level only.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="451" rx="10"/>
  <text x="24.00" y="34.00" class="title">How an ask range is read</text>
  <text x="24.00" y="56.00" class="sub muted">bucket &gt;= $1 AND bucket &lt; $2, $1 = 2024-01-16T06:00:00Z, $2 = 2024-01-26T00:00:00Z, over buckets '1 hour, 1 day, 7 days'</text>
  <path class="a-acc" d="M177.25 96.00 L850.00 96.00"/>
  <path class="a-acc" d="M177.25 90.00 L177.25 102.00"/>
  <path class="a-acc" d="M850.00 90.00 L850.00 102.00"/>
  <text x="177.25" y="84.00" class="s acc">from Tue 2024-01-16 06:00</text>
  <text x="850.00" y="84.00" class="s acc" text-anchor="end">to Fri 2024-01-26 00:00</text>
  <text x="24.00" y="100.00" class="h">the range</text>
  <text x="24.00" y="149.00" class="h">7 days</text>
  <text x="24.00" y="165.00" class="s muted">level 2</text>
  <rect class="box" x="160.00" y="124.00" width="136.00" height="40.00" rx="4"/>
  <text x="168.00" y="149.00" class="s ink2">… to Thu 18</text>
  <rect class="accbox" x="298.00" y="124.00" width="481.00" height="40.00" rx="4"/>
  <text x="539.50" y="149.00" class="b" text-anchor="middle">Thu 2024-01-18 00:00 to Thu 2024-01-25 00:00: 1 bucket</text>
  <rect class="box" x="781.00" y="124.00" width="69.00" height="40.00" rx="4"/>
  <text x="789.00" y="149.00" class="s ink2">Thu 25 to …</text>
  <text x="24.00" y="223.00" class="h">1 day</text>
  <text x="24.00" y="239.00" class="s muted">level 1</text>
  <rect class="box" x="160.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="193.50" y="223.00" class="s ink2" text-anchor="middle">Tue 16</text>
  <rect class="accbox" x="229.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="262.50" y="223.00" class="b" text-anchor="middle">Wed 17</text>
  <rect class="box" x="298.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="331.50" y="223.00" class="s ink2" text-anchor="middle">Thu 18</text>
  <rect class="box" x="367.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="400.50" y="223.00" class="s ink2" text-anchor="middle">Fri 19</text>
  <rect class="box" x="436.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="469.50" y="223.00" class="s ink2" text-anchor="middle">Sat 20</text>
  <rect class="box" x="505.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="538.50" y="223.00" class="s ink2" text-anchor="middle">Sun 21</text>
  <rect class="box" x="574.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="607.50" y="223.00" class="s ink2" text-anchor="middle">Mon 22</text>
  <rect class="box" x="643.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="676.50" y="223.00" class="s ink2" text-anchor="middle">Tue 23</text>
  <rect class="box" x="712.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="745.50" y="223.00" class="s ink2" text-anchor="middle">Wed 24</text>
  <rect class="accbox" x="781.00" y="198.00" width="67.00" height="40.00" rx="4"/>
  <text x="814.50" y="223.00" class="b" text-anchor="middle">Thu 25</text>
  <text x="24.00" y="297.00" class="h">1 hour</text>
  <text x="24.00" y="313.00" class="s muted">level 0, date_bin</text>
  <rect class="frame" x="160.00" y="272.00" width="690.00" height="40.00" rx="4"/>
  <rect class="accbox" x="177.25" y="272.00" width="49.75" height="40.00" rx="3"/>
  <path class="rule" d="M180.12 302.00 L180.12 312.00"/>
  <path class="rule" d="M183.00 302.00 L183.00 312.00"/>
  <path class="rule" d="M185.88 302.00 L185.88 312.00"/>
  <path class="rule" d="M188.75 302.00 L188.75 312.00"/>
  <path class="rule" d="M191.62 302.00 L191.62 312.00"/>
  <path class="rule" d="M194.50 302.00 L194.50 312.00"/>
  <path class="rule" d="M197.38 302.00 L197.38 312.00"/>
  <path class="rule" d="M200.25 302.00 L200.25 312.00"/>
  <path class="rule" d="M203.12 302.00 L203.12 312.00"/>
  <path class="rule" d="M206.00 302.00 L206.00 312.00"/>
  <path class="rule" d="M208.88 302.00 L208.88 312.00"/>
  <path class="rule" d="M211.75 302.00 L211.75 312.00"/>
  <path class="rule" d="M214.62 302.00 L214.62 312.00"/>
  <path class="rule" d="M217.50 302.00 L217.50 312.00"/>
  <path class="rule" d="M220.38 302.00 L220.38 312.00"/>
  <path class="rule" d="M223.25 302.00 L223.25 312.00"/>
  <path class="rule" d="M226.12 302.00 L226.12 312.00"/>
  <text x="237.00" y="297.00" class="b">18 buckets, Tue 16 06:00 to Wed 17 00:00</text>
  <text x="203.12" y="266.00" class="lbl acc" text-anchor="middle">read 1</text>
  <text x="262.50" y="192.00" class="lbl acc" text-anchor="middle">read 2</text>
  <text x="539.50" y="118.00" class="lbl acc" text-anchor="middle">read 3</text>
  <text x="814.50" y="192.00" class="lbl acc" text-anchor="middle">read 4</text>
  <text x="24.00" y="356.00" class="b">21 buckets read instead of 234 hour buckets</text>
  <text x="24.00" y="378.00" class="s">A level takes the whole buckets inside what is left: the start rounded up to its edge, the end rounded down.</text>
  <text x="24.00" y="396.00" class="s">What is left at either end falls to the next narrower level, down to the date_bin level, in time order.</text>
  <text x="24.00" y="414.00" class="s">GROUP BY bucket reads the date_bin level only: 234 hour buckets, one group each. Both bounds must be on hour edges.</text>
  <text x="24.00" y="436.00" class="s muted">Every ask bound is a parameter in Unix seconds or RFC 3339, so values never become query text.</text>
</svg>
