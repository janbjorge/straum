<svg xmlns="http://www.w3.org/2000/svg" width="720" height="494" viewBox="0 0 720 494" role="img" aria-labelledby="t d">
  <title id="t">Cells keep the join column; an ask reads the dim through it</title>
  <desc id="d">The usage view at the 1 hour width, which joins accounts to events on a.id = e.account_id. Three cells at 09:00: purchase for account 7 with 2 events, purchase for account 9 with 5, refund for account 7 with 1. The projection of accounts maps id 7 to eu and 9 to us. An ask for events by region looks up each cell's account_id and adds the cells of a region: eu 3, us 5. Moving account 7 to us changes one projection row and no cell; the next answer is us 8.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="493" rx="10"/>
  <text x="24" y="38" class="title">Cells keep the join column; an ask reads the dim through it</text>
  <text x="24" y="62" class="s muted">The usage view at the 1 hour width, asked for events by region.</text>
  <text x="96" y="98" class="lbl acc">CELLS</text>
  <text x="160" y="120" class="lbl muted" text-anchor="middle">BUCKET</text>
  <text x="280" y="120" class="lbl muted" text-anchor="middle">KIND</text>
  <text x="410" y="120" class="lbl muted" text-anchor="middle">ACCOUNT_ID</text>
  <text x="540" y="120" class="lbl muted" text-anchor="middle">EVENTS</text>
  <rect class="box" x="96" y="130" width="528" height="34" rx="6"/>
  <text x="24" y="152" class="s muted">cell</text>
  <text x="160" y="152" class="mono ink2" text-anchor="middle">09:00</text>
  <text x="280" y="152" class="mono ink2" text-anchor="middle">purchase</text>
  <text x="410" y="152" class="mono acc b" text-anchor="middle">7</text>
  <text x="540" y="152" class="mono ink2" text-anchor="middle">2</text>
  <rect class="box" x="96" y="172" width="528" height="34" rx="6"/>
  <text x="24" y="194" class="s muted">cell</text>
  <text x="160" y="194" class="mono ink2" text-anchor="middle">09:00</text>
  <text x="280" y="194" class="mono ink2" text-anchor="middle">purchase</text>
  <text x="410" y="194" class="mono acc b" text-anchor="middle">9</text>
  <text x="540" y="194" class="mono ink2" text-anchor="middle">5</text>
  <rect class="box" x="96" y="214" width="528" height="34" rx="6"/>
  <text x="24" y="236" class="s muted">cell</text>
  <text x="160" y="236" class="mono ink2" text-anchor="middle">09:00</text>
  <text x="280" y="236" class="mono ink2" text-anchor="middle">refund</text>
  <text x="410" y="236" class="mono acc b" text-anchor="middle">7</text>
  <text x="540" y="236" class="mono ink2" text-anchor="middle">1</text>
  <path class="a-acc" d="M410 262 L376 300" marker-end="url(#m-acc)"/>
  <text x="408" y="290" class="s acc">look up account_id</text>
  <text x="96" y="296" class="lbl acc">PROJECTION OF accounts</text>
  <text x="370" y="318" class="lbl muted" text-anchor="middle">ID</text>
  <text x="450" y="318" class="lbl muted" text-anchor="middle">REGION</text>
  <rect class="box" x="320" y="328" width="180" height="34" rx="6"/>
  <text x="370" y="350" class="mono acc b" text-anchor="middle">7</text>
  <text x="450" y="350" class="mono ink2" text-anchor="middle">eu</text>
  <rect class="box" x="320" y="370" width="180" height="34" rx="6"/>
  <text x="370" y="392" class="mono acc b" text-anchor="middle">9</text>
  <text x="450" y="392" class="mono ink2" text-anchor="middle">us</text>
  <text x="96" y="356" class="s muted">id and region,</text>
  <text x="96" y="376" class="s muted">kept current</text>
  <text x="96" y="396" class="s muted">from the stream</text>
  <path class="a" d="M508 366 H556" marker-end="url(#m)"/>
  <text x="564" y="296" class="lbl acc">ANSWER</text>
  <text x="600" y="318" class="lbl muted" text-anchor="middle">REGION</text>
  <text x="668" y="318" class="lbl muted" text-anchor="middle">EVENTS</text>
  <rect class="accbox" x="564" y="328" width="132" height="34" rx="6"/>
  <text x="600" y="350" class="mono acc b" text-anchor="middle">eu</text>
  <text x="668" y="350" class="mono acc b" text-anchor="middle">3</text>
  <rect class="accbox" x="564" y="370" width="132" height="34" rx="6"/>
  <text x="600" y="392" class="mono acc b" text-anchor="middle">us</text>
  <text x="668" y="392" class="mono acc b" text-anchor="middle">5</text>
  <path class="rule" d="M24 420 H696"/>
  <text x="24" y="448" class="s ink2"><tspan class="mono">UPDATE accounts SET region = 'us' WHERE id = 7</tspan> changes one</text>
  <text x="24" y="472" class="s ink2">projection row and no cell. The next answer is <tspan class="mono acc b">us 8</tspan>.</text>
</svg>
