  <text x="680" y="256" class="lbl muted" text-anchor="end">SUM</text>
  <rect class="accbox" x="462" y="266" width="228" height="32" rx="6"/>
  <text x="474" y="287" class="mono acc b" text-anchor="start">0 0</text>
  <text x="552" y="287" class="mono acc b" text-anchor="start">2</text>
  <text x="680" y="287" class="mono acc b" text-anchor="end">220.00</text>
  <text x="454" y="287" class="mono muted" text-anchor="end">0</text>
