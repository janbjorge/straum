<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-labelledby="t d">
  <title id="t">How a row finds its cell</title>
  <desc id="d">Inside the usage rollup. 1: each key value of the row is coded per key column: kind purchase is 0, account_id 7 is 0. 2: the time 09:41:07 is floored to 09:00 at the 1 hour level, whose buckets are a BTreeMap by start. 3: in the hot bucket's cells the index hashes the key codes 0, 0 to a slot holding cell 0. 4: cell 0 adds the row: rows 1 to 2, the Sum of amount 100.00 to 220.00. The cells are columns side by side: keys, rows and one state per input.</desc>
