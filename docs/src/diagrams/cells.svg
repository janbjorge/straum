  <rect class="accbox" x="244" y="222" width="168" height="32" rx="6"/>
  <text x="258" y="243" class="mono acc b" text-anchor="start">09:00</text>
  <text x="398" y="243" class="s acc" text-anchor="end">Hot</text>
  <rect class="box" x="244" y="262" width="168" height="32" rx="6"/>
  <text x="258" y="283" class="mono ink2" text-anchor="start">10:00</text>
  <rect class="box" x="244" y="302" width="168" height="32" rx="6"/>
  <text x="258" y="323" class="mono ink2" text-anchor="start">…</text>
  <text x="244" y="362" class="s muted" text-anchor="start">a BTreeMap by start;</text>
  <text x="244" y="381" class="s muted" text-anchor="start">None: rows with no time</text>
  <path class="a-acc" d="M412 238 H432" marker-end="url(#m-acc)"/>
  <rect class="frame" x="436" y="160" width="264" height="244" rx="10"/>
