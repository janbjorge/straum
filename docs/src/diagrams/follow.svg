<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
  <title id="t">Following and answering at once</title>
  <desc id="d">Sequence: PostgreSQL streams pgoutput to the stream thread, which decodes until a Commit and hands it to the Writer. The Writer unseals touched buckets, takes the write lock, applies the commit and unlocks, then tells the stream thread the applied LSN, which it reports to PostgreSQL. Meanwhile a client posts an ask; the App answers it under the read lock. About every second the Writer reads the WAL position on the plain connection, feeds the lag and runs a seal pass.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="599" rx="10"/>
  <text x="32" y="42" class="title">Following and answering at once</text>
  <text x="32" y="64" class="sub muted">One writer applies the stream; asks read meanwhile. They share the store behind one read-write lock.</text>
  <rect class="box2" x="30" y="88" width="140" height="40" rx="6"/>
  <text x="100" y="113" class="h" text-anchor="middle">PostgreSQL</text>
  <path class="life" d="M100 128L100 560"/>
  <rect class="box2" x="205" y="88" width="140" height="40" rx="6"/>
  <text x="275" y="113" class="h" text-anchor="middle">stream thread</text>
  <path class="life" d="M275 128L275 560"/>
  <rect class="box2" x="380" y="88" width="140" height="40" rx="6"/>
  <text x="450" y="113" class="h" text-anchor="middle">Writer</text>
  <path class="life" d="M450 128L450 560"/>
  <rect class="box2" x="555" y="88" width="140" height="40" rx="6"/>
  <text x="625" y="113" class="h" text-anchor="middle">App</text>
  <path class="life" d="M625 128L625 560"/>
  <rect class="box2" x="730" y="88" width="140" height="40" rx="6"/>
  <text x="800" y="113" class="h" text-anchor="middle">Client</text>
  <path class="life" d="M800 128L800 560"/>
  <path class="a" d="M100 170 L271 170" marker-end="url(#m)"/>
  <text x="110" y="162" class="s ink2 halo" text-anchor="start">pgoutput changes</text>
  <text x="285" y="196" class="s ink2" text-anchor="start">decode until Commit;</text>
  <text x="285" y="212" class="s ink2" text-anchor="start">up to 64 read ahead</text>
  <path class="a" d="M275 240 L446 240" marker-end="url(#m)"/>
  <text x="285" y="232" class="s ink2 halo" text-anchor="start">Commit</text>
  <path class="a-acc" d="M800 240 L629 240" marker-end="url(#m-acc)"/>
  <text x="790" y="232" class="s acc" text-anchor="end">POST /ask</text>
  <text x="460" y="266" class="s ink2" text-anchor="start">unseal touched buckets</text>
  <rect class="accbox" x="614" y="280" width="22" height="90" rx="4"/>
  <text x="645" y="296" class="s acc" text-anchor="start">read lock</text>
  <text x="645" y="312" class="mono acc" text-anchor="start">ask_with</text>
  <rect class="errbox" x="439" y="300" width="22" height="70" rx="4"/>
  <text x="470" y="318" class="s err" text-anchor="start">write lock,</text>
  <text x="470" y="334" class="s err" text-anchor="start">apply, unlock</text>
  <text x="470" y="356" class="s muted" text-anchor="start">waits for the read</text>
  <path class="a-acc" d="M625 390 L796 390" marker-end="url(#m-acc)"/>
  <text x="635" y="382" class="s acc" text-anchor="start">answer, as_of, Straum-LSN</text>
  <path class="a" d="M450 420 L279 420" marker-end="url(#m)"/>
  <text x="440" y="412" class="s ink2 halo" text-anchor="end">applied LSN</text>
  <path class="a" d="M275 450 L104 450" marker-end="url(#m)"/>
  <text x="265" y="442" class="s ink2 halo" text-anchor="end">status update r</text>
  <path class="a-cfg" d="M450 490 L104 490" marker-end="url(#m)"/>
  <text x="440" y="482" class="s ink2 halo" text-anchor="end">wal() on the plain connection, every ~1 s</text>
  <text x="460" y="516" class="s ink2" text-anchor="start">lag.read, then a seal pass</text>
  <path class="rule" d="M32 548H848"/>
  <text x="32" y="572" class="s muted" text-anchor="start">A long ask holds the read lock and delays the writer, which shows as lag. Keepalives are answered by the stream thread, so a busy writer never times out.</text>
</svg>
