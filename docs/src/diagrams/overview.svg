<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324" role="img" aria-labelledby="t d">
  <title id="t">PostgreSQL stays the source; Straum keeps cells in memory</title>
  <desc id="d">straum plan reads the spec and prints setup SQL, which a table owner runs once in PostgreSQL. straum run reads the spec at start, loads the tables once from a snapshot, then applies every commit after it, keeping a cell per group and bucket in memory. Apps post asks over HTTP and get rows with as_of.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:15px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:14px}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:15px}
  .h{font-size:16px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:14px}
  .lbl{font-size:13px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="719" height="323" rx="10"/>
  <text x="24" y="38" class="title">PostgreSQL stays the source; Straum keeps cells in memory</text>
  <rect class="box" x="24" y="70" width="140" height="60" rx="8"/>
  <text x="38" y="95" class="h mono">straum plan</text>
  <text x="38" y="116" class="s ink2">prints setup SQL</text>
  <rect class="box" x="314" y="70" width="160" height="60" rx="8"/>
  <text x="328" y="95" class="h mono">spec.sql</text>
  <text x="328" y="116" class="s ink2">your views</text>
  <path class="a" d="M314 100 L168 100" marker-end="url(#m)"/>
  <path class="a-plan" d="M94 130 L94 186" marker-end="url(#m-plan)"/>
  <text x="102" y="163" class="s ink2 halo" text-anchor="start">setup SQL, run once</text>
  <path class="a" d="M394 130 L394 186" marker-end="url(#m)"/>
  <text x="402" y="163" class="s ink2 halo" text-anchor="start">read at start</text>
  <rect class="box2" x="24" y="190" width="140" height="110" rx="8"/>
  <text x="38" y="215" class="h">PostgreSQL</text>
  <text x="38" y="236" class="s ink2">the tables</text>
  <text x="38" y="255" class="s ink2">the spec names</text>
  <rect class="accbox" x="314" y="190" width="160" height="110" rx="8"/>
  <text x="328" y="215" class="h mono acc">straum run</text>
  <text x="328" y="236" class="s ink2">a cell per group</text>
  <text x="328" y="255" class="s ink2">and bucket,</text>
  <text x="328" y="274" class="s ink2">in memory</text>
  <rect class="box" x="574" y="190" width="122" height="110" rx="8"/>
  <text x="588" y="215" class="h">Your app</text>
  <text x="588" y="236" class="s ink2">dashboards,</text>
  <text x="588" y="255" class="s ink2">reports</text>
  <path class="a-acc" d="M164 226 L310 226" marker-end="url(#m-acc)"/>
  <text x="239" y="217" class="s ink2 halo" text-anchor="middle">load once</text>
  <path class="a-acc" d="M164 270 L310 270" marker-end="url(#m-acc)"/>
  <text x="239" y="261" class="s ink2 halo" text-anchor="middle">then every commit</text>
  <path class="a" d="M574 226 L478 226" marker-end="url(#m)"/>
  <text x="524" y="217" class="mono ink2 halo" text-anchor="middle">POST /ask</text>
  <path class="a" d="M474 270 L570 270" marker-end="url(#m)"/>
  <text x="524" y="261" class="s ink2 halo" text-anchor="middle">rows, as_of</text>
</svg>
