# Straum on one host with Docker Compose: the release's image, the spec
# from spec.sql beside this file, and the DSN from the file dsn, read
# through a Compose secret so it never sits in the environment.
#
#   STRAUM_VERSION=X.Y.Z docker compose -p straum up -d
#   docker compose -p straum exec straum /straum status
name: straum
services:
  straum:
    image: ghcr.io/janbjorge/straum:${STRAUM_VERSION:?set STRAUM_VERSION to a release, such as 1.2.3}
    command:
      - run
      - /etc/straum/spec.sql
      # logical decoding; physical reads the WAL of wal_level replica.
      - --wal
      - logical
      - --dsn-file
      - /run/secrets/dsn
      - --listen
      - 0.0.0.0:8080
      # Only these Host names, so a page rebound to 127.0.0.1 can't ask.
      - --allow-hosts
      - localhost:8080,127.0.0.1:8080
      # The health check reads this port, so a full 8080 cannot fail it.
      - --health-listen
      - 127.0.0.1:8081
      # Up to three times this comes on top of the cells: the queue, a
      # transaction and unsent answers. The default, 1Gi, passes mem_limit.
      - --max-stream-memory
      - 256Mi
    secrets:
      - dsn
    volumes:
      - ./spec.sql:/etc/straum/spec.sql:ro
    # Only this host reaches it: Straum has no authentication or TLS.
    ports:
      - 127.0.0.1:8080:8080
    # Straum exits 1 on any failure and keeps no state, so starting it
    # again is the whole recovery; it loads every table from a new slot.
    restart: unless-stopped
    # Room for straum's 10 s drain of the asks in flight.
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Size it by the cells the spec keeps.
    mem_limit: 1g
    # Healthy once loaded and within --max-lag. start_interval needs
    # Compose 2.20.2. Compose only reports the check and never
    # restarts on it, so a long load or a lag stops nothing.
    healthcheck:
      test: ["CMD", "/straum", "status", "--url", "http://127.0.0.1:8081", "--timeout", "3"]
      interval: 10s
      timeout: 5s
      start_period: 1h
      start_interval: 5s
secrets:
  dsn:
    file: ./dsn
