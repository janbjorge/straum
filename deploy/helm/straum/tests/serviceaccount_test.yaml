suite: serviceaccount
templates:
  - serviceaccount.yaml
  - deployment.yaml
  - configmap.yaml
release:
  name: demo
set:
  image.repository: registry.example/straum
  dsn.existingSecret: straum-dsn
  spec: "CREATE VIEW trips WITH (key = id) AS SELECT count(*) AS trips FROM public.trips t;"
tests:
  - it: makes a ServiceAccount with no token, which the pod runs as
    asserts:
      - template: serviceaccount.yaml
        isKind:
          of: ServiceAccount
      - template: serviceaccount.yaml
        equal:
          path: metadata.name
          value: demo-straum
      - template: serviceaccount.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: serviceaccount.yaml
        notExists:
          path: metadata.annotations
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: demo-straum

  - it: takes a name and annotations, as for Azure workload identity
    set:
      serviceAccount.name: straum-identity
      serviceAccount.annotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    asserts:
      - template: serviceaccount.yaml
        equal:
          path: metadata.name
          value: straum-identity
      - template: serviceaccount.yaml
        equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000000
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: straum-identity

  - it: makes none when told not to, and runs as the namespace's default
    set:
      serviceAccount.create: false
    asserts:
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: runs as a ServiceAccount made elsewhere
    set:
      serviceAccount.create: false
      serviceAccount.name: shared
    asserts:
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: shared
