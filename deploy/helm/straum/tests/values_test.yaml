suite: values
templates:
  - deployment.yaml
  - configmap.yaml
set:
  image.tag: "1.0.0"
  dsn.existingSecret: straum-dsn
  wal: logical
  spec: "CREATE VIEW trips AS SELECT buckets(t.at, '1 hour') AS bucket, count(*) AS trips FROM public.trips AS t GROUP BY 1;"
tests:
  - it: refuses a release that names no WAL
    template: deployment.yaml
    set:
      wal: ""
    asserts:
      - failedTemplate:
          errorPattern: "wal: name the WAL straum reads"

  - it: refuses a WAL straum doesn't read
    template: deployment.yaml
    set:
      wal: both
    asserts:
      - failedTemplate:
          errorPattern: "wal"

  - it: refuses a listen address other than every IPv4 or every IPv6 one
    template: deployment.yaml
    set:
      listenAddress: "127.0.0.1"
    asserts:
      - failedTemplate:
          errorPattern: "listenAddress"

  - it: takes the values straum takes
    template: deployment.yaml
    set:
      maxLag: 1
      maxRetainedWal: "1"
      maxTransactionRows: 1
      maxAnswerRows: 1
      replicaCount: 0
    asserts:
      - isKind:
          of: Deployment

  - it: refuses a lag bound below a second
    set:
      maxLag: 0
    asserts:
      - failedTemplate:
          errorPattern: "maxLag"

  - it: refuses a lag bound that isn't whole seconds
    set:
      maxLag: "30s"
    asserts:
      - failedTemplate:
          errorPattern: "maxLag"

  - it: refuses a WAL limit Straum can't read
    set:
      maxRetainedWal: 4GB
    asserts:
      - failedTemplate:
          errorPattern: "maxRetainedWal"

  - it: refuses a WAL Straum can't read
    set:
      wal: both
    asserts:
      - failedTemplate:
          errorPattern: "wal"

  - it: refuses a page memory limit Straum can't read
    set:
      wal: physical
      maxPageMemory: 1GB
    asserts:
      - failedTemplate:
          errorPattern: "maxPageMemory"

  - it: refuses a load memory limit Straum can't read
    set:
      maxLoadMemory: 1GB
    asserts:
      - failedTemplate:
          errorPattern: "maxLoadMemory"

  - it: refuses a load memory limit of nothing
    set:
      maxLoadMemory: "0"
    asserts:
      - failedTemplate:
          errorPattern: "maxLoadMemory"

  - it: takes a memory limit in bytes or with a suffix
    template: deployment.yaml
    set:
      maxMemory: "1073741824"
    asserts:
      - isKind:
          of: Deployment

  - it: refuses a memory limit Straum can't read
    set:
      maxMemory: 1GB
    asserts:
      - failedTemplate:
          errorPattern: "maxMemory"

  - it: refuses a memory limit of nothing
    set:
      maxMemory: "0"
    asserts:
      - failedTemplate:
          errorPattern: "maxMemory"

  - it: refuses a WAL limit of nothing
    set:
      maxRetainedWal: "0"
    asserts:
      - failedTemplate:
          errorPattern: "maxRetainedWal"

  - it: refuses a transaction limit of nothing
    set:
      maxTransactionRows: 0
    asserts:
      - failedTemplate:
          errorPattern: "maxTransactionRows"

  - it: refuses a transaction limit that isn't a count
    set:
      maxTransactionRows: "many"
    asserts:
      - failedTemplate:
          errorPattern: "maxTransactionRows"

  - it: refuses an answer limit of nothing
    set:
      maxAnswerRows: 0
    asserts:
      - failedTemplate:
          errorPattern: "maxAnswerRows"

  - it: refuses an answer limit that isn't a count
    set:
      maxAnswerRows: "many"
    asserts:
      - failedTemplate:
          errorPattern: "maxAnswerRows"

  - it: refuses a rollout deadline of nothing
    set:
      progressDeadlineSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "progressDeadlineSeconds"

  - it: refuses a rollout deadline that isn't whole seconds
    set:
      progressDeadlineSeconds: "1h"
    asserts:
      - failedTemplate:
          errorPattern: "progressDeadlineSeconds"

  - it: refuses an empty key for the roots
    set:
      rootCert.existingSecret: rds-ca
      rootCert.key: ""
    asserts:
      - failedTemplate:
          errorPattern: "rootCert"

  - it: refuses a digest that isn't sha256
    set:
      image.digest: latest
    asserts:
      - failedTemplate:
          errorPattern: "digest"

  - it: refuses an unknown pull policy
    set:
      image.pullPolicy: Sometimes
    asserts:
      - failedTemplate:
          errorPattern: "pullPolicy"

  - it: refuses keys it doesn't know, such as a misspelt one
    set:
      maxlag: 5
    asserts:
      - failedTemplate:
          errorPattern: "maxlag"
