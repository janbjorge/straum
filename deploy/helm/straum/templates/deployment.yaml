apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "straum.fullname" . }}
  labels:
    {{- include "straum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds | int64 }}
  strategy:
    type: RollingUpdate
    # The new pod loads every table before the old one stops.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "straum.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A new spec rolls the pod.
        checksum/spec: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "straum.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "straum.serviceAccountName" . }}
      automountServiceAccountToken: false
      # A Service named straum would put STRAUM_PORT, STRAUM_SERVICE_HOST
      # and more in the environment, under the prefix straum reads its
      # own settings from.
      enableServiceLinks: false
      # Room for the preStop sleep and straum's 10 s drain of the asks in
      # flight.
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The Restricted Pod Security Standard. No user or group is pinned.
      # On Kubernetes the image's numeric user, 65532, applies, which
      # runAsNonRoot can check. OpenShift's restricted-v2 refuses a user
      # outside the project's range and assigns one from that range when
      # none is set.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: straum
          image: {{ include "straum.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - /etc/straum/spec.sql
            - --listen
            - {{ printf "%s:8080" .Values.listenAddress | quote }}
            - --publication
            - {{ .Values.publication | quote }}
            - --max-lag
            - {{ .Values.maxLag | int64 | quote }}
            - --max-retained-wal
            - {{ .Values.maxRetainedWal | quote }}
            - --max-transaction-rows
            - {{ .Values.maxTransactionRows | int64 | quote }}
            - --max-answer-rows
            - {{ .Values.maxAnswerRows | int64 | quote }}
            - --max-stream-memory
            - {{ .Values.maxStreamMemory | quote }}
            - --wal
            - {{ required "wal: name the WAL straum reads, logical or physical" .Values.wal | quote }}
            {{- if eq .Values.wal "physical" }}
            - --max-page-memory
            - {{ .Values.maxPageMemory | quote }}
            {{- end }}
            {{- with .Values.maxMemory }}
            - --max-memory
            - {{ . | quote }}
            {{- end }}
          env:
            - name: STRAUM_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "dsn.existingSecret: name the Secret that holds the DSN of straum's replication role" .Values.dsn.existingSecret | quote }}
                  key: {{ .Values.dsn.key | quote }}
          ports:
            - name: http
              containerPort: 8080
          # The hook finishes before SIGTERM, and the grace period is
          # already counting. The Service marks the pod not ready as
          # shutdown starts, while straum is still serving; the sleep
          # covers that. It runs in the kubelet, so the image needs no
          # shell, and it needs Kubernetes 1.30, where it is on by default.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Off while the tables load and while straum lags past maxLag.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # The process only: a slow load or lag never restarts the pod.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spec
              mountPath: /etc/straum
              readOnly: true
            {{- if .Values.rootCert.existingSecret }}
            # Beside the spec, not under it: a mount point can't be made
            # inside the read-only ConfigMap volume.
            - name: root-cert
              mountPath: /etc/straum-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: spec
          configMap:
            name: {{ include "straum.fullname" . }}
        {{- with .Values.rootCert.existingSecret }}
        - name: root-cert
          secret:
            secretName: {{ . | quote }}
            items:
              - key: {{ $.Values.rootCert.key | quote }}
                path: ca.pem
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
