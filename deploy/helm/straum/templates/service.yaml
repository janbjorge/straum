apiVersion: v1
kind: Service
metadata:
  name: {{ include "straum.fullname" . }}
  labels:
    {{- include "straum.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "straum.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
