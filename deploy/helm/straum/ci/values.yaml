# What scripts/check-chart.py lints and renders the chart with.
image:
  tag: "1.0.0"
dsn:
  existingSecret: "straum-dsn"
rootCert:
  existingSecret: "straum-ca"
spec: |
  CREATE VIEW trips WITH (buckets = '1 hour') AS
  SELECT date_bin('1 hour', t.at, timestamptz 'epoch') AS bucket,
         t.kind AS kind,
         count(*) AS trips
  FROM public.trips AS t
  GROUP BY 1, 2;
