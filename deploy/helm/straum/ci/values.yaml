# What scripts/check-chart.py lints and renders the chart with.
image:
  tag: "1.0.0"
dsn:
  existingSecret: "straum-dsn"
wal: "logical"
rootCert:
  existingSecret: "straum-ca"
spec: |
  CREATE VIEW trips AS
  SELECT buckets(t.at, '1 hour') AS bucket,
         t.kind AS kind,
         count(*) AS trips
  FROM public.trips AS t
  GROUP BY 1, 2;
