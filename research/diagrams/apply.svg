<svg xmlns="http://www.w3.org/2000/svg" width="880" height="722" viewBox="0 0 880 722" role="img" aria-labelledby="t d">
  <title id="t">What each pgoutput message does to the store</title>
  <desc id="d">A matrix of pgoutput messages against fact tables with REPLICA IDENTITY FULL, fact tables with the default identity, and dim tables. Facts with the default identity get no old row on update or delete, so Straum starts over. Relation messages that change a column start over. Commit applies the transaction under one write lock. Starting over clears readiness, waits with backoff, drops the store and the slot, and loads again from a new slot.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="721" rx="10"/>
  <text x="32" y="42" class="title">A fact needs the old row; without it, Straum starts over</text>
  <text x="32" y="64" class="sub muted">What State::apply does with each pgoutput message, per kind of table.</text>
  <text x="172" y="108" class="h">Fact, REPLICA IDENTITY FULL</text>
  <text x="172" y="126" class="s muted">mutable facts; straum plan sets it</text>
  <text x="404" y="108" class="h">Fact, default identity</text>
  <text x="404" y="126" class="s muted">what append = true facts get</text>
  <text x="636" y="108" class="h">Dim</text>
  <text x="636" y="126" class="s muted">its key is the replica identity</text>
  <text x="32" y="108" class="lbl muted">MESSAGE</text>
  <path class="rule" d="M32 142H848"/>
  <text x="32" y="184.0" class="mono b">Insert</text>
  <rect class="box" x="160" y="154" width="224" height="50" rx="5"/>
  <text x="172" y="184.0">add the row to its cell</text>
  <rect class="box" x="392" y="154" width="224" height="50" rx="5"/>
  <text x="404" y="184.0">add the row to its cell</text>
  <rect class="box" x="624" y="154" width="224" height="50" rx="5"/>
  <text x="636" y="184.0">upsert the row by key</text>
  <text x="32" y="242.0" class="mono b">Update</text>
  <rect class="box" x="160" y="212" width="224" height="50" rx="5"/>
  <text x="172" y="234.0">remove the old row,</text>
  <text x="172" y="250.0">add the new one</text>
  <rect class="errbox" x="392" y="212" width="224" height="50" rx="5"/>
  <text x="404" y="242.0" class="err b">start over: no old row</text>
  <rect class="box" x="624" y="212" width="224" height="50" rx="5"/>
  <text x="636" y="234.0">upsert the new row; delete</text>
  <text x="636" y="250.0">the old key if it changed</text>
  <text x="32" y="300.0" class="mono b">Delete</text>
  <rect class="box" x="160" y="270" width="224" height="50" rx="5"/>
  <text x="172" y="300.0">remove the old row</text>
  <rect class="errbox" x="392" y="270" width="224" height="50" rx="5"/>
  <text x="404" y="300.0" class="err b">start over: no old row</text>
  <rect class="box" x="624" y="270" width="224" height="50" rx="5"/>
  <text x="636" y="300.0">delete by key</text>
  <text x="32" y="358.0" class="mono b">Truncate</text>
  <rect class="box" x="160" y="328" width="224" height="50" rx="5"/>
  <text x="172" y="358.0">empty the rollup</text>
  <rect class="box" x="392" y="328" width="224" height="50" rx="5"/>
  <text x="404" y="358.0">empty the rollup</text>
  <rect class="box" x="624" y="328" width="224" height="50" rx="5"/>
  <text x="636" y="358.0">empty the rows</text>
  <text x="32" y="416.0" class="mono b">Relation</text>
  <rect class="box" x="160" y="386" width="224" height="50" rx="5"/>
  <text x="172" y="408.0">column types unchanged:</text>
  <text x="172" y="424.0">nothing to do</text>
  <rect class="errbox" x="392" y="386" width="456" height="50" rx="5"/>
  <text x="404" y="408.0" class="err b">a column reads differently, is dropped, or turns to</text>
  <text x="404" y="424.0" class="err b">a type Straum doesn’t read: start over</text>
  <text x="32" y="474.0" class="mono b">Commit</text>
  <rect class="accbox" x="160" y="444" width="688" height="50" rx="5"/>
  <text x="172" y="466.0" xml:space="preserve">apply every change above under one write lock, <tspan class="muted">then </tspan><tspan class="b acc">position = the commit’s end LSN</tspan></text>
  <text x="172" y="482.0" xml:space="preserve"><tspan class="s muted">Changes after a Truncate in the same transaction still apply.</tspan></text>
  <text x="32" y="518" class="s ink2">Also start over: a row that doesn’t fit its rollup, such as removing a row never added, and an update that leaves out</text>
  <text x="32" y="535" class="s ink2">an unchanged TOASTed value with no old row to take it from. Tables in the publication but not in the spec are skipped.</text>
  <path class="rule" d="M32 566H848"/>
  <text x="32" y="596" class="lbl err">START OVER</text>
  <text x="118" y="596" class="s muted">Writer::step, then the backoff loop in the binary</text>
  <rect class="errbox" x="32" y="614" width="186" height="76" rx="6"/>
  <text x="44" y="638" class="h err">Not ready</text>
  <text x="44" y="658" class="s ink2">position cleared;</text>
  <text x="44" y="674" class="s ink2">/readyz 503 with the error</text>
  <path class="a" d="M220 652 L238 652" marker-end="url(#m)"/>
  <rect class="box" x="242" y="614" width="186" height="76" rx="6"/>
  <text x="254" y="638" class="h">Wait</text>
  <text x="254" y="658" class="s ink2">1 s, doubling after each</text>
  <text x="254" y="674" class="s ink2">failure in a row, up to 60 s</text>
  <path class="a" d="M430 652 L448 652" marker-end="url(#m)"/>
  <rect class="box" x="452" y="614" width="186" height="76" rx="6"/>
  <text x="464" y="638" class="h">Drop store and slot</text>
  <text x="464" y="658" class="s ink2">close the connection;</text>
  <text x="464" y="674" class="s ink2">PostgreSQL drops the slot</text>
  <path class="a" d="M640 652 L658 652" marker-end="url(#m)"/>
  <rect class="box" x="662" y="614" width="186" height="76" rx="6"/>
  <text x="674" y="638" class="h">Load again</text>
  <text x="674" y="658" class="s ink2">new temporary slot,</text>
  <text x="674" y="674" class="s ink2">full load, as at start</text>
</svg>
