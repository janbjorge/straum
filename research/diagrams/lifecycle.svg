<svg xmlns="http://www.w3.org/2000/svg" width="880" height="648" viewBox="0 0 880 648" role="img" aria-labelledby="t d">
  <title id="t">Straum lifecycle and readiness</title>
  <desc id="d">Writer states: Loading turns Ready when every table is loaded. Ready and Lagging both stream and answer asks; Lagging means more than --max-lag behind, and /readyz is 503. Any failure, including retained WAL over --max-retained-wal, clears readiness and waits with backoff before loading again from a new slot. SIGTERM stops Straum. A memory budget is planned.</desc>
  <style>
  text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px}
  .mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;font-size:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .sub{font-size:13px}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:12px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em}
  .num{font-variant-numeric:tabular-nums}
  .it{font-style:italic}
  .halo{stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
  .canvas,.box,.box2,.frame,.accbox,.errbox,.planbox{stroke-width:1px}
  .planbox{stroke-dasharray:5 4}
  .frame{stroke-dasharray:none}
  .rule,.life{stroke-width:1px;fill:none}
  .life{stroke-dasharray:3 4}
  .a,.a-acc,.a-err,.a-plan,.a-cfg{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
  .a-plan{stroke-dasharray:5 4}
  .a-cfg{stroke-dasharray:1.5 4;stroke-width:1.6px}
  .canvas{fill:#fbfcfc;stroke:#dfe3e8}
  text{fill:#18202a}
  .ink2{fill:#3d4753}
  .muted{fill:#5f6977}
  .acc{fill:#0b5c56}
  .err{fill:#b4472c}
  .plantext{fill:#8a939f}
  .halo{stroke:#fbfcfc}
  .box{fill:#f1f3f6;stroke:#c3cad3}
  .box2{fill:#e6eaef;stroke:#c3cad3}
  .frame{fill:none;stroke:#c3cad3}
  .accbox{fill:#e4f3f0;stroke:#0f766e}
  .errbox{fill:#faece7;stroke:#b4472c}
  .planbox{fill:none;stroke:#8a939f}
  .rule{stroke:#c3cad3}
  .life{stroke:#c3cad3}
  .fillacc{fill:#0f766e}
  .fillerr{fill:#b4472c}
  .fillink{fill:#3d4753}
  .fillplan{fill:#8a939f}
  .fillcanvas{fill:#fbfcfc}
  .a{stroke:#3d4753}
  .a-acc{stroke:#0f766e}
  .a-err{stroke:#b4472c}
  .a-plan{stroke:#8a939f}
  .a-cfg{stroke:#5f6977}
  .band{fill:#f1f3f6}
  .errband{fill:#faece7}
  @media (prefers-color-scheme: dark){
  .canvas{fill:#0f141a;stroke:#2a323c}
  text{fill:#e6edf3}
  .ink2{fill:#c4ccd5}
  .muted{fill:#97a2ae}
  .acc{fill:#7fd3c7}
  .err{fill:#e2795c}
  .plantext{fill:#6f7a86}
  .halo{stroke:#0f141a}
  .box{fill:#161d25;stroke:#3b4551}
  .box2{fill:#1e2730;stroke:#3b4551}
  .frame{fill:none;stroke:#3b4551}
  .accbox{fill:#0f2724;stroke:#3cb4a4}
  .errbox{fill:#2b1914;stroke:#e2795c}
  .planbox{fill:none;stroke:#6f7a86}
  .rule{stroke:#3b4551}
  .life{stroke:#3b4551}
  .fillacc{fill:#3cb4a4}
  .fillerr{fill:#e2795c}
  .fillink{fill:#c4ccd5}
  .fillplan{fill:#6f7a86}
  .fillcanvas{fill:#0f141a}
  .a{stroke:#c4ccd5}
  .a-acc{stroke:#3cb4a4}
  .a-err{stroke:#e2795c}
  .a-plan{stroke:#6f7a86}
  .a-cfg{stroke:#97a2ae}
  .band{fill:#161d25}
  .errband{fill:#2b1914}
  }
  </style>
  <defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillink" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillacc" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillerr" d="M1 1.5 9 5 1 8.5z"/></marker>
  <marker id="m-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fillplan" d="M1 1.5 9 5 1 8.5z"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="879" height="647" rx="10"/>
  <text x="32" y="42" class="title">/readyz is 200 only while Straum streams and keeps up</text>
  <text x="32" y="64" class="sub muted">Writer states, readiness in each, and what moves Straum between them.</text>
  <rect class="frame" x="414" y="154" width="234" height="350" rx="10"/>
  <text x="430" y="494" class="lbl acc">STREAMING, ASKS ANSWER</text>
  <circle class="fillink" cx="48" cy="224" r="7"/>
  <path class="a" d="M55 224 L80 224" marker-end="url(#m)"/>
  <rect class="box" x="84" y="170" width="206" height="108" rx="8"/>
  <text x="98" y="196" class="h">Loading</text>
  <text x="98" y="216" class="s ink2">new temporary slot, catalog</text>
  <text x="98" y="232" class="s ink2">checks, dims then facts</text>
  <path class="rule" d="M84 248H290"/>
  <text x="98" y="268" xml:space="preserve"><tspan class="mono muted">/readyz </tspan><tspan class="mono b err">503</tspan><tspan class="mono"> loading</tspan></text>
  <rect class="accbox" x="432" y="170" width="206" height="108" rx="8"/>
  <text x="446" y="196" class="h acc">Ready</text>
  <text x="446" y="216" class="s ink2">applies commits; at most</text>
  <text x="446" y="232" class="s ink2">--max-lag behind</text>
  <path class="rule" d="M432 248H638"/>
  <text x="446" y="268" xml:space="preserve"><tspan class="mono muted">/readyz </tspan><tspan class="mono b acc">200</tspan><tspan class="mono"> ready</tspan></text>
  <rect class="box" x="432" y="366" width="206" height="108" rx="8"/>
  <text x="446" y="392" class="h">Lagging</text>
  <text x="446" y="412" class="s ink2">more than --max-lag behind,</text>
  <text x="446" y="428" class="s ink2">30 s by default</text>
  <path class="rule" d="M432 444H638"/>
  <text x="446" y="464" xml:space="preserve"><tspan class="mono muted">/readyz </tspan><tspan class="mono b err">503</tspan><tspan class="mono"> &lt;n&gt; s behind</tspan></text>
  <rect class="errbox" x="84" y="366" width="206" height="108" rx="8"/>
  <text x="98" y="392" class="h err">Waiting</text>
  <text x="98" y="412" class="s ink2">1 s, doubling after each</text>
  <text x="98" y="428" class="s ink2">failure in a row, up to 60 s</text>
  <path class="rule" d="M84 444H290"/>
  <text x="98" y="464" xml:space="preserve"><tspan class="mono muted">/readyz </tspan><tspan class="mono b err">503</tspan><tspan class="mono"> &lt;the error&gt;</tspan></text>
  <rect class="box" x="704" y="170" width="144" height="108" rx="8"/>
  <text x="718" y="196" class="h">Stopping</text>
  <text x="718" y="216" class="s ink2">stops accepting,</text>
  <text x="718" y="232" class="s ink2">drains asks, exits</text>
  <path class="rule" d="M704 248H848"/>
  <text x="718" y="268" xml:space="preserve"><tspan class="s muted">PG drops the slot</tspan></text>
  <path class="a-acc" d="M290 210 L428 210" marker-end="url(#m-acc)"/>
  <text x="352" y="202" class="s" text-anchor="middle">every table</text>
  <text x="352" y="228" class="s" text-anchor="middle">loaded</text>
  <path class="a-acc" d="M560 170 C560 140 616 140 616 166" marker-end="url(#m-acc)"/>
  <text x="588" y="136" class="s acc halo" text-anchor="middle">commit applied</text>
  <path class="a" d="M470 278 L470 362" marker-end="url(#m)"/>
  <path class="a" d="M600 362 L600 278" marker-end="url(#m)"/>
  <text x="480" y="312" class="s ink2">falls behind</text>
  <text x="590" y="336" class="s ink2" text-anchor="end">catches up</text>
  <path class="a-err" d="M150 278 L150 362" marker-end="url(#m-err)"/>
  <text x="140" y="324" class="s err" text-anchor="end">failure</text>
  <path class="a" d="M230 362 L230 282" marker-end="url(#m)"/>
  <text x="240" y="324" class="s ink2">new slot</text>
  <path class="a-err" d="M414 420 L294 420" marker-end="url(#m-err)"/>
  <text x="354" y="412" class="s err halo" text-anchor="middle">any failure</text>
  <path class="a" d="M648 210 L700 210" marker-end="url(#m)"/>
  <text x="674" y="202" class="s halo" text-anchor="middle">SIGTERM</text>
  <path class="a-plan" d="M648 420 L700 420" marker-end="url(#m-plan)"/>
  <rect class="planbox" x="704" y="392" width="144" height="56" rx="8"/>
  <text x="718" y="415" class="h plantext">Failed</text>
  <text x="836" y="415" class="s plantext" text-anchor="end">planned</text>
  <text x="718" y="434" class="s plantext">memory over budget</text>
  <path class="rule" d="M32 524H848"/>
  <text x="32" y="548" xml:space="preserve"><tspan class="s b err">Failures: </tspan><tspan class="s ink2">setup missing, a load or source error, a lost connection or failover, a change that doesn’t fit,</tspan></text>
  <text x="32" y="568" xml:space="preserve"><tspan class="s ink2">and the slot holding more WAL than </tspan><tspan class="mono">--max-retained-wal</tspan><tspan class="s ink2"> (4Gi by default), so a Straum that can’t keep up never fills the disk.</tspan></text>
  <text x="32" y="588" xml:space="preserve"><tspan class="mono">/livez</tspan><tspan class="s ink2"> answers 200 in every state, so lag never restarts the pod. </tspan><tspan class="s muted">After a failure, /readyz keeps the error until a load succeeds.</tspan></text>
  <text x="32" y="608" xml:space="preserve"><tspan class="s ink2">A panic aborts the process, since the store may be half written; Kubernetes restarts the pod.</tspan></text>
</svg>
