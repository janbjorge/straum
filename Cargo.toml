[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# ADR-0053. A crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
# They ask for doc comments that say what; ours say why (AGENTS.md).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
