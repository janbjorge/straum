[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# ADR-0013. A crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
# They ask for doc comments that say what; ours say why (AGENTS.md).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# They ask for a closure chain where ADR-0013 wants a for loop.
manual_find = "allow"
manual_find_map = "allow"
manual_filter = "allow"
manual_filter_map = "allow"
manual_map = "allow"
manual_flatten = "allow"
manual_try_fold = "allow"
manual_ok_err = "allow"
needless_range_loop = "allow"
explicit_counter_loop = "allow"

[workspace.lints.rust]
# cargo-llvm-cov sets cfg(coverage), which keeps the WAL benchmark out of
# coverage.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
