[package]
name = "straum-pg"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# CRC-32C on every WAL record with the CPU's instructions, as PostgreSQL
# computes it; std has none, and a bitwise loop read 330 MiB/s at most.
crc32c = "0.6.9"
# Forced by postgres-protocol: its writers take BytesMut.
bytes = "1.12.1"
# Forced by postgres-protocol: its parsers return FallibleIterator.
fallible-iterator = "0.2"
# Wire messages and SCRAM (ADR-0007).
postgres-protocol = "0.6.12"
# TLS (ADR-0012).
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
# Pure Rust crypto for rustls, no C toolchain (ADR-0012).
rustls-graviola = "0.4.0"
# Default trust roots when no CA file is given.
webpki-roots = "1.0.11"
straum-app = { path = "../straum-app" }
straum-domain = { path = "../straum-domain" }

[dev-dependencies]
straum-notation = { path = "../straum-notation" }

[lints]
workspace = true
