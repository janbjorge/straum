[package]
name = "straum-http"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "http1", "server-graceful"] }
jiff = { version = "0.2.41", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time"] }
straum-app = { path = "../straum-app" }
straum-domain = { path = "../straum-domain" }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
straum-notation = { path = "../straum-notation" }
