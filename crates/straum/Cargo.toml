[package]
name = "straum"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# getrlimit and setrlimit without unsafe, which std lacks: `straum run`
# raises its soft limit of open files, so that the connections do not
# take every file descriptor. Cargo.lock holds it already, through
# rustyline.
nix = { version = "0.31.4", default-features = false, features = ["resource"] }
# Raw terminal mode for `straum shell`: line editing, history kept in a
# file and Tab completion, which std lacks and which needs unsafe to write
# by hand.
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
# Reads the views `straum shell` completes from; straum-http already
# builds it.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
straum-app = { path = "../straum-app" }
straum-domain = { path = "../straum-domain" }
straum-http = { path = "../straum-http" }
straum-notation = { path = "../straum-notation" }
straum-pg = { path = "../straum-pg" }

[lints]
workspace = true
