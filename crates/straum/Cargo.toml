[package]
name = "straum"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Runs the HTTP server and waits for signals (ADR-0008).
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "signal"] }
# Raw terminal mode for `straum shell`: line editing, history kept in a
# file and Tab completion, which std lacks and which needs unsafe to write
# by hand.
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
# Reads the views `straum shell` completes from; straum-http already
# builds it.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
straum-app = { path = "../straum-app" }
straum-domain = { path = "../straum-domain" }
straum-http = { path = "../straum-http" }
straum-notation = { path = "../straum-notation" }
straum-pg = { path = "../straum-pg" }

[dev-dependencies]
# PostgreSQL in Docker for tests (ADR-0024).
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
